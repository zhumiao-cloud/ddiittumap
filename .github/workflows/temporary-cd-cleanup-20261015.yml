name: One-shot cleanup of Oct15 CloudDrive runs
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-cleanup-20261015.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Delete completed temporary CloudDrive runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for run in 38666636300 38666770412 38667636741 38668203639 38668260835 38668320864; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq '.status' | grep -qx completed; then
              echo "SKIP_NOT_COMPLETED ${run}"
              continue
            fi
            ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)"
            for aid in $ids; do
              if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" >/dev/null 2>&1; then
                echo "ARTIFACT_REMOVED ${run}"
              else
                echo "ARTIFACT_REMOVE_FAILED ${run}"
              fi
            done
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" >/dev/null 2>&1; then
              echo "RUN_REMOVED ${run}"
            else
              echo "RUN_REMOVE_FAILED ${run}"
            fi
          done
          echo "ONE_SHOT_RUN_CLEANUP_DONE"
