name: Temporary SFTP post-fix rescan verification
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-sftp-scan-verify.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify SFTP ownership remains clear through explicit rescan
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/sftp-owner-once' EXIT
          mkdir -p /tmp/sftp-owner-once
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/sftp-owner-once/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/sftp-owner-once --python_out=/tmp/sftp-owner-once /tmp/sftp-owner-once/clouddrive.proto
          cat >/tmp/sftp-owner-once/final.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          
          
          import time
          roots=[a.path for r in rpc("GetAllCloudApis") for a in r.apis if a.name.strip().lower()=="sftp" or a.path.rstrip("/").split("/")[-1].lower()=="sftp"]
          if len(roots)!=1:raise RuntimeError("ambiguous SFTP cloud entry")
          root=roots[0]
          def get():
           v=rpc("BackupGetAll")[0].backups
           t=[x for x in v if x.backup.sourcePath==root]
           if len(t)!=1:raise RuntimeError("SFTP backup not uniquely identified")
           return t[0]
          def inspect(tag):
           b=get()
           q=cls(S.methods_by_name["BackupGetSyncIssues"].input_type)();q.value=root
           issues=[x for r in rpc("BackupGetSyncIssues",q) for x in r.issues]
           last=max((int(e.time.seconds) for e in b.errors if cat(e.message)=="OWNER_CONFLICT"),default=0)
           replicas=[{"source":x.isSource,"state":name(x,"state"),"indexReady":x.indexReady,"pendingChanges":x.pendingChanges} for x in b.replicaStatuses]
           print(tag,json.dumps({"status":name(b,"status"),"marker":b.backup.syncOwnerMarker,
            "openIssues":b.openSyncIssues,"types":dict(collections.Counter(name(i,"kind") for i in issues)),
            "ownerErrorTime":last,"totalPasses":getfield(b.syncStats,"totalPasses",0),
            "lastPassAt":getfield(b.syncStats.lastPassAt,"seconds",0),"replicas":replicas},ensure_ascii=False),flush=True)
           return (b,last,len(issues))
          b,t0,n=inspect("BASELINE")
          if b.backup.syncOwnerMarker or n or not b.backup.isEnabled:raise RuntimeError("Preflight not clean; do not rescan")
          q=cls(S.methods_by_name["BackupRestartWalkingThrough"].input_type)();q.value=root
          rpc("BackupRestartWalkingThrough",q)
          print("ACTION RESCAN_REQUEST_ACCEPTED")
          time.sleep(25)
          b1,t1,n1=inspect("CHECK_25S")
          time.sleep(25)
          b2,t2,n2=inspect("CHECK_50S")
          if b2.backup.syncOwnerMarker or n2 or t2>t0:raise RuntimeError("Ownership conflict reappeared")
          print("RESULT NO_RECURRENT_OWNER_CONFLICT","passesBefore",getfield(b.syncStats,"totalPasses",0),"passesAfter",getfield(b2.syncStats,"totalPasses",0))
          PY
          PYTHONPATH=/tmp/sftp-owner-once python3 -u /tmp/sftp-owner-once/final.py
