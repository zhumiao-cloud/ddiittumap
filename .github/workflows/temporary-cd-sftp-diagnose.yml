name: One-time CloudDrive SFTP read-only diagnosis
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-sftp-diagnose.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.event_name == 'push' && github.actor == 'zhumiao-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Inspect SFTP interface using official gRPC-Web protocol
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/cd-sftp' EXIT
          mkdir -p /tmp/cd-sftp
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-sftp/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-sftp --python_out=/tmp/cd-sftp /tmp/cd-sftp/clouddrive.proto
          cat > /tmp/cd-sftp/inspect.py <<'PY'
          import os, ssl, http.client, struct, json, hashlib
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          token=os.environ["CD_TOKEN"]
          svc=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d): return message_factory.GetMessageClass(d)
          def fs(d): return [(f.name, f.message_type.name if f.message_type else f.type, f.is_repeated) for f in d.fields]
          def rpc(name,req=None):
              meth=svc.methods_by_name[name]
              req=req if req is not None else cls(meth.input_type)()
              data=req.SerializeToString()
              conn=http.client.HTTPSConnection("cd.evren.cn",443,timeout=35,context=ssl.create_default_context())
              try:
                  conn.request("POST","/clouddrive.CloudDriveFileSrv/"+name,b"\x00"+struct.pack(">I",len(data))+data,{"content-type":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+token})
                  resp=conn.getresponse();http_code=resp.status;heads={k.lower():v for k,v in resp.getheaders()};raw=resp.read(5000001)
              finally:conn.close()
              if len(raw)>5000000:raise RuntimeError("Response exceeds safe size")
              trailer={};out=[];pos=0
              while pos<len(raw):
                  if pos+5>len(raw):raise RuntimeError("Truncated gRPC frame")
                  fl=raw[pos];n=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
                  if pos+n>len(raw):raise RuntimeError("Broken gRPC frame")
                  chunk=raw[pos:pos+n];pos+=n
                  if fl&0x80:
                      for line in chunk.decode("utf-8","replace").splitlines():
                          if ":" in line:
                              k,v=line.split(":",1);trailer[k.strip().lower()]=v.strip()
                  else:
                      if fl&1:raise RuntimeError("Compressed frame unsupported")
                      obj=cls(meth.output_type)();obj.ParseFromString(chunk);out.append(obj)
              st=trailer.get("grpc-status",heads.get("grpc-status"))
              print("RPC_STATUS",name,"HTTP",http_code,"grpc",st,flush=True)
              if http_code!=200 or st!="0":raise RuntimeError("Failed "+name+" HTTP="+str(http_code)+" grpc="+str(st))
              return out
          selected=[]
          for method in svc.methods:
              if any(w in method.name.lower() for w in ("sftp","stor","mount","refre","reload","reconnect","subfiles","fileinfo","cloudapi","getfile")):
                  selected.append((method.name,fs(method.input_type),fs(method.output_type)))
          for x in selected: print("RPC_SCHEMA",json.dumps(x,ensure_ascii=False),flush=True)
          for meth in svc.methods:
              if any(w in meth.name.lower() for w in ("refresh","reconnect","restart","reload","cache","reauth","api","token")):
                  print("RPC_CAPABILITY",meth.name,fs(meth.input_type),flush=True)
          if "GetAllCloudApis" in svc.methods_by_name:
              itemdesc=svc.methods_by_name["GetAllCloudApis"].output_type.fields_by_name["apis"].message_type
              print("CLOUDAPI_FIELD_TYPES",fs(itemdesc),flush=True)
              for resp in rpc("GetAllCloudApis"):
                  for api in resp.apis:
                      if any(f.type==9 and f.name.lower() in ("name","path") and "sftp" in str(getattr(api,f.name)).lower() for f in api.DESCRIPTOR.fields):
                          view=[]
                          for f in api.DESCRIPTOR.fields:
                              if any(w in f.name.lower() for w in ("state","status","connect","login","expired","error","online","enable","valid","mount")):
                                  val=getattr(api,f.name)
                                  if f.enum_type:
                                      val=f.enum_type.values_by_number[int(val)].name
                                  elif f.type==9:
                                      val="present" if val else "empty"
                                  elif f.type==11:
                                      val="nested"
                                  view.append((f.name,str(val)))
                          print("SFTP_STATE",json.dumps(view),flush=True)
          for name in ["GetSubFiles","GetMountPoints","GetAllCloudApis"]:
              if name not in svc.methods_by_name:continue
              desc=svc.methods_by_name[name].input_type
              rq=cls(desc)()
              if name in ("GetSubFiles","GetFileInfo"):
                  for field in desc.fields:
                      if field.type==9 and field.name.lower() in ("path","value","folderpath","filepath"):
                          setattr(rq,field.name,"/")
              try:
                  rows=rpc(name,rq)
                  print("READ_RESULT",name,"responses",len(rows),flush=True)
                  for result in rows:
                      for field,value in result.ListFields():
                          if field.is_repeated:
                              print("REPEATED_FIELD",name,field.name,"count",len(value),flush=True)
                              for item in list(value)[:100]:
                                  if hasattr(item,"ListFields"):
                                      for f,v in item.ListFields():
                                          if f.type==9 and any(z in f.name.lower() for z in ("name","path","type","provider")) and "sftp" in str(v).lower():
                                              print("SFTP_MATCH",name,"field",f.name,"value",str(v)[:100],flush=True)
                          elif field.type==9:
                              print("STRING_FIELD",name,field.name,"sftp_match",("sftp" in str(value).lower()),flush=True)
                          elif field.type==11:
                              print("MESSAGE_FIELD",name,field.name,"fields",[f.name for f,v in value.ListFields()],flush=True)
                          else:
                              print("SCALAR_FIELD",name,field.name,str(value)[:80],flush=True)
              except Exception as e:
                  print("READ_FAILED",name,type(e).__name__,str(e)[:120],flush=True)
          PY
          PYTHONPATH=/tmp/cd-sftp python3 -u /tmp/cd-sftp/inspect.py
