name: One-shot CloudDrive follow-up cleanup
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-followup-clean.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove completed CloudDrive follow-up logs and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          for run in 38510824422 38510899515 38510970433; do
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)"
            for artifact in $artifacts; do
              if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" >/dev/null 2>&1; then
                echo "ARTIFACT_REMOVED ${artifact}"
              else
                echo "ARTIFACT_REMOVE_FAILED ${artifact}"
              fi
            done
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" >/dev/null 2>&1; then
              echo "RUN_REMOVED ${run}"
            else
              echo "RUN_REMOVE_FAILED ${run}"
            fi
          done
          echo "FINISHED"
