name: SXY multiome secret probe
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-secret-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Verify secret availability without printing value
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -n "${SXY_PSWD:-}" ]; then
            echo 'SXY_SECRET_AVAILABLE=YES'
          else
            echo 'SXY_SECRET_AVAILABLE=NO'
            exit 20
          fi
