name: SXY multiome ARC restart
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-secret-probe.yml'
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Start corrected existing ARC pipeline
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top "set -euo pipefail; u=sxy-mmul10-multiome-arc-20261010; r=/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/sxy_mmul10_arc_build_and_run.sh; p=/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/arc_multiome_three_samples.sh; test -s \"\$r\"; test -s \"\$p\"; bash -n \"\$p\"; ! grep -q -- '--multi-thread-chunk-size' \"\$p\"; if systemctl --user show \"\$u\" -p LoadState --value 2>/dev/null | grep -qx loaded; then systemctl --user reset-failed \"\$u\" 2>/dev/null || true; systemctl --user restart \"\$u\"; else systemd-run --user --unit=\"\$u\" --description='Mmul10 ARC three Multiome conversions' /usr/bin/bash \"\$r\"; fi; sleep 10; systemctl --user show \"\$u\" -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager; journalctl --user -u \"\$u\" --no-pager --output=cat -n 35 | tail -n 35"
          unset SSHPASS SXY_PSWD
