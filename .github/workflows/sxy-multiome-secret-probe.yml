name: SXY multiome rclone flag repair
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-secret-probe.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Remove unsupported rclone flag and restart existing ARC unit
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top "set -euo pipefail; p=/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/arc_multiome_three_samples.sh; test -s \"\$p\"; cp -p \"\$p\" \"\$p.before_rclone_flag_fix_20261012\"; sed -i 's/ --multi-thread-chunk-size 16M//g' \"\$p\"; bash -n \"\$p\"; ! grep -q -- '--multi-thread-chunk-size' \"\$p\"; grep -q -- '--multi-thread-streams 8' \"\$p\"; systemctl --user reset-failed sxy-mmul10-multiome-arc-20261010.service 2>/dev/null || true; systemctl --user restart sxy-mmul10-multiome-arc-20261010.service; sleep 8; systemctl --user show sxy-mmul10-multiome-arc-20261010.service -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager; journalctl --user -u sxy-mmul10-multiome-arc-20261010.service --no-pager --output=cat -n 25 | tail -n 25"
          unset SSHPASS SXY_PSWD
