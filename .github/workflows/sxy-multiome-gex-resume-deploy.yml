name: SXY multiome GEX resume deploy
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-gex-resume-deploy.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy persistent safe GEX resume service
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          target='/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/sxy_multiome_gex_resume.sh'
          sshpass -e scp -q -P 20111 -o StrictHostKeyChecking=yes scripts/sxy_multiome_gex_resume.sh "h3039@sxycloud1.top:$target"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          target='/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/sxy_multiome_gex_resume.sh'
          unit=sxy-multiome-gex-resume-20261011
          chmod 700 "$target"
          bash -n "$target"
          if systemctl --user show "$unit" -p LoadState --value 2>/dev/null | grep -qx loaded; then
            state="$(systemctl --user is-active "$unit" 2>/dev/null || true)"
            if [ "$state" = active ]; then
              echo RESUME_UNIT_ALREADY_ACTIVE
            else
              systemctl --user reset-failed "$unit" 2>/dev/null || true
              systemctl --user restart "$unit"
              echo RESUME_UNIT_RESTARTED
            fi
          else
            systemd-run --user --unit="$unit" --description="Verified GEX range resume then multiome ARC proxy resume" /usr/bin/bash "$target"
            echo RESUME_UNIT_STARTED
          fi
          sleep 4
          systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          journalctl --user -u "$unit" --no-pager --output=cat -n 25 | tail -n 25
          REMOTE
          unset SSHPASS SXY_PSWD
