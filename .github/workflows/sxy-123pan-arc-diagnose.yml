name: Temporary sanitized 123pan CDN diagnosis
on:
  pull_request:
    paths:
      - '.github/workflows/sxy-123pan-arc-diagnose.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect remote status and safely sample small bytes
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          if test -z "$SXY_PSWD"; then echo "SXY_SECRET_NOT_SET_IN_PRIVATE_REPO"; exit 3; fi
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          ROOT=/home/h3039/PROJECTS/zhumiao/danxibao3
          WORK=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          UNIT=sxy-mmul10-multiome-local-two-v3-20261013.service
          FILE=danxibao3_webdav:P10MK2/GEX/2-GEX_S1_L001_R1_001.fastq.gz
          echo "DIAG_TIME=$(date -Is)"
          echo "RCLONE_VERSION=$(rclone version | head -1)"
          echo "MOUNT_FSTYPE=$(findmnt -n -o FSTYPE -T "$ROOT" | head -1)"
          echo 'SERVICE_STATE:'
          systemctl --user show "$UNIT" -p ActiveState -p SubState -p ExecMainStatus || true
          echo "DISK_FREE_BYTES=$(df -B1 --output=avail "$WORK" | tail -1 | tr -d ' ')"
          echo "SOURCE_METADATA:"
          if timeout 25 rclone lsf danxibao3_webdav:P10MK2/GEX --files-only --format sp --separator '|' 2>/dev/null | grep -F '2-GEX_S1_L001_R1_001.fastq.gz' | cut -c1-115; then :; else echo "SOURCE_METADATA_FAILED"; fi
          if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/19324' 2>/dev/null; then echo 'PROXY_PORT_OPEN'; else echo 'PROXY_PORT_CLOSED'; fi
          probe() {
            label="$1"; shift
            tmp=$(mktemp)
            set +e
            timeout 105 "$@" rclone cat "$FILE" --count 65536 > /dev/null 2>"$tmp"
            rc=$?
            set -e
            bytes_error=$(wc -c < "$tmp")
            if test "$rc" -eq 0; then
              echo "$label=OK_BYTES_65536"
            elif grep -Eiq '403 Forbidden|status code: 403|statuscode=403' "$tmp"; then
              echo "$label=HTTP_403"
            elif grep -Eiq '401 Unauthorized|status code: 401' "$tmp"; then
              echo "$label=HTTP_401"
            elif grep -Eiq 'timeout|deadline exceeded' "$tmp"; then
              echo "$label=TIMEOUT"
            elif grep -Eiq 'proxyconnect|proxy|connect refused' "$tmp"; then
              echo "$label=PROXY_ERROR"
            else
              echo "$label=ERROR_CODE_$rc"
            fi
            rm -f -- "$tmp"
          }
          probe PROXY_ROUTE env HTTPS_PROXY=http://127.0.0.1:19324 https_proxy=http://127.0.0.1:19324
          probe DIRECT_ROUTE env -u HTTPS_PROXY -u https_proxy -u HTTP_PROXY -u http_proxy -u ALL_PROXY -u all_proxy
          echo 'SANITIZED_PROBE_COMPLETE'
          REMOTE
          unset SSHPASS SXY_PSWD