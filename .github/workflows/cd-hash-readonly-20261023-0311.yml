          sJHCl1nvCULQY0NhwsHW/2mC98Ge
          -----END CERTIFICATE-----
          CERT
          cat > "$d/check.py" <<'PYCODE'
          import os,ssl,http.client,struct,json,time,hashlib,posixpath,urllib.parse,re
          from google.protobuf import message_factory,json_format
          import clouddrive_pb2 as pb
          S=pb.DESCRIPTOR.services_by_name['CloudDriveFileSrv']; H='cd.evren.cn'; LIMIT=32*1024*1024
          out={'utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'samples':[],'limitations':[]}
          def rpc(name,**kw):
           m=S.methods_by_name[name];q=message_factory.GetMessageClass(m.input_type)(**kw);p=q.SerializeToString();c=http.client.HTTPSConnection(H,timeout=30)
           try:
            c.request('POST','/clouddrive.CloudDriveFileSrv/'+name,b'\0'+struct.pack('>I',len(p))+p,{'authorization':'Bearer '+os.environ['CD_API_KEY'],'content-type':'application/grpc-web+proto','x-grpc-web':'1'});r=c.getresponse();raw=r.read(4000001);status=r.status;headers=dict(r.getheaders())
           finally:c.close()
           if len(raw)>4000000:raise RuntimeError('metadata cap')
           a=[];j=0;tr={}
           while j<len(raw):
            if j+5>len(raw):raise RuntimeError('frame')
            f=raw[j];n=int.from_bytes(raw[j+1:j+5],'big');j+=5;z=raw[j:j+n];j+=n
            if len(z)!=n:raise RuntimeError('frame length')
            if f&128:
             for line in z.decode().splitlines():
              if ':' in line:k,v=line.split(':',1);tr[k.strip().lower()]=v.strip()
            else:
             if f:raise RuntimeError('compressed frame unsupported')
             x=message_factory.GetMessageClass(m.output_type)();x.ParseFromString(z);a.append(x)
           if status!=200 or tr.get('grpc-status',headers.get('grpc-status'))!='0':raise RuntimeError('RPC '+name+' status '+str(status)+' grpc '+tr.get('grpc-status','missing'))
           return a
          
          def panel(endpoint,body):
           ts=str(int(time.time()));token=hashlib.md5(('1panel'+os.environ['PANEL_API_KEY']+ts).encode()).hexdigest();c=http.client.HTTPSConnection('panel.evren.cn',timeout=30)
           try:
            c.request('POST','/api/v2/'+endpoint,json.dumps(body),{'1Panel-Token':token,'1Panel-Timestamp':ts,'Content-Type':'application/json'});r=c.getresponse();data=r.read(1000001)
            if r.status!=200 or len(data)>1000000:raise RuntimeError('panel bounded response')
            return data
           finally:c.close()
          
          def hashread(path,size):
           u=rpc('GetDownloadUrlPath',path=path,preview=False,lazy_read=False,get_direct_url=False)[0].downloadUrlPath
           u=u.replace('{SCHEME}','https').replace('{HOST}',H).replace('{PREVIEW}','false')
           if not u.startswith('/') or u.startswith('//'):raise RuntimeError('nonlocal URL refused')
           c=http.client.HTTPSConnection(H,timeout=30);n=0;md=hashlib.md5();sh=hashlib.sha256();start=time.monotonic()
           try:
            c.request('GET',u,headers={'Accept-Encoding':'identity'});r=c.getresponse()
            if r.status!=200:raise RuntimeError('download HTTP '+str(r.status))
            if r.getheader('Content-Encoding','identity')!='identity':raise RuntimeError('encoded body')
            length=r.getheader('Content-Length')
            if length and int(length)!=size:raise RuntimeError('HTTP length mismatch')
            while True:
             if time.monotonic()-start>120:raise RuntimeError('read deadline')
             b=r.read(min(65536,size-n+1))
             if not b:break
             n+=len(b)
             if n>size or n>LIMIT:raise RuntimeError('stream cap exceeded')
             md.update(b);sh.update(b)
           finally:c.close()
           return {'bytes':n,'md5':md.hexdigest(),'sha256':sh.hexdigest(),'complete':n==size}
          
          def main():
           out['runtime']=json_format.MessageToDict(rpc('GetRuntimeInfo')[0],preserving_proto_field_name=True)
           try:
            raw=panel('containers/download/log',{'container':'clouddrive','containerType':'container','since':'2h','tail':100,'timestamp':True}).decode(errors='replace')
            out['panel_error_counts']={'md5':len(re.findall('md5',raw,re.I)),'code20000':raw.count('20000'),'etag':len(re.findall('etag',raw,re.I))}
            # Store only matching fixed error phrase and adjacent timestamp, never paths or raw logs.
            out['panel_error_matches']=[{'timestamp':re.search(r'\d{4}-\d\d-\d\dT[\d:.]+Z',l).group(0) if re.search(r'\d{4}-\d\d-\d\dT[\d:.]+Z',l) else None,'code20000':'20000' in l,'md5':'md5' in l.lower(),'etag':'etag' in l.lower()} for l in raw.splitlines() if '20000' in l or ('md5' in l.lower() and 'etag' in l.lower())][:100]
           except Exception as e:out['limitations'].append('panel '+type(e).__name__)
           rows=rpc('GetUploadFileList',getAll=False,itemsPerPage=100,pageNumber=0,statusFilter=9)[0]
           out['matching_upload_total']=rows.totalCountFiltered
           candidates=[]
           for x in rows.uploadFiles:
            if ('md5' in x.errorMessage.lower() or '20000' in x.errorMessage):candidates.append(x)
           out['matching_sizes']=[int(x.size) for x in candidates]
           backs=rpc('BackupGetAll')[0].backups
           mapped=[]
           for x in sorted(candidates,key=lambda x:x.size):
            if not(0<x.size<=LIMIT):continue
            for bs in backs:
             b=bs.backup
             for d in b.destinations:
              dp=d.destinationPath.rstrip('/')+'/'
              if x.destPath.startswith(dp):
               p=b.sourcePath.rstrip('/')+'/'+x.destPath[len(dp):]
               if p not in mapped:mapped.append(p)
            if len(mapped)>=2:break
           for i,p in enumerate(mapped[:2]):
            s={'sample':'S'+str(i+1),'reads':[]};out['samples'].append(s)
            try:
             f=rpc('FindFileByPath',path=p)[0]
             if not(0<f.size<=LIMIT) or f.isDirectory or int(f.fileEncryptionType)!=0:raise RuntimeError('sample size/type/encryption guard')
             s.update(size=int(f.size),metadata_before=f.fileHashes.get(1,''),source_type=str(f.CloudAPI.cloudName) if hasattr(f.CloudAPI,'cloudName') else '')
             # Validate provider from root metadata; avoid reading third-party mount connections.
             root='/'+p.strip('/').split('/')[0];rf=rpc('FindFileByPath',path=root)[0]
             cd=json_format.MessageToDict(rf.CloudAPI)
             s['provider_name']=rf.CloudAPI.name
             if 'baidu' not in rf.CloudAPI.name.lower() and '百度' not in rf.CloudAPI.name and '百度' not in root:raise RuntimeError('not established Baidu source')
             parent=posixpath.dirname(p);a=rpc('GetSubFiles',path=parent,forceRefresh=True)
             matches=[x for z in a for x in z.subFiles if x.fullPathName==p]
             s['refreshed_listing_md5']=matches[0].fileHashes.get(1,'') if len(matches)==1 else None
             f2=rpc('FindFileByPath',path=p)[0];s['metadata_after_refresh']=f2.fileHashes.get(1,'')
             if f2.size!=f.size:raise RuntimeError('changed size')
             for j in range(2):s['reads'].append(hashread(p,f.size))
             f3=rpc('FindFileByPath',path=p)[0];s['metadata_after_reads']=f3.fileHashes.get(1,'');s['size_after_reads']=int(f3.size)
            except Exception as e:s['error']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
           if not out['samples']:out['limitations'].append('No mapped failed file <=32 MiB in bounded error page; no file bytes read')
          try:main()
          except Exception as e:out['fatal']=str(e) if isinstance(e,RuntimeError) else type(e).__name__
          print(json.dumps(out,ensure_ascii=False))
          PYCODE
          set +e
          (
           test -n "${CD_API_KEY:-}" && test -n "${PANEL_API_KEY:-}" || exit 3
           curl -fsSL --max-time 30 https://www.clouddrive2.com/api/clouddrive.proto -o "$d/clouddrive.proto" || exit 4
           printf 'a00b4620cbce0a9bd6009f8e771ba68ea7375080ca7f15f4c7c206310ba2ec9d  %s\n' "$d/clouddrive.proto" | sha256sum -c - || exit 5
           python3 -m pip -q install protobuf grpcio-tools || exit 6
           python3 -m grpc_tools.protoc -I"$d" --python_out="$d" "$d/clouddrive.proto" || exit 7
           PYTHONPATH="$d" timeout 650 python3 "$d/check.py"
          ) > "$d/report" 2>&1
          rc=$?
          set -e
          printf '\nEXIT=%s\n' "$rc" >> "$d/report"
          openssl cms -encrypt -binary -aes-256-cbc -in "$d/report" -outform DER -out "$d/report.enc" "$d/cert.pem"
          echo ENCRYPTED_BEGIN
          base64 -w 100 "$d/report.enc"
          echo ENCRYPTED_END
          test "$rc" -eq 0
