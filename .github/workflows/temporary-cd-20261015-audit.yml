name: Temporary CloudDrive current transfer and issue audit
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-20261015-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Inspect official CloudDrive queue and provider statuses
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/cd-current-audit' EXIT
          mkdir -p /tmp/cd-current-audit
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-current-audit/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-current-audit --python_out=/tmp/cd-current-audit /tmp/cd-current-audit/clouddrive.proto
          cat >/tmp/cd-current-audit/audit.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          
          
          import time,re,collections,json,hashlib
          def classify(s):
           s=str(s).lower()
           for name,expr in (
           ("TIMEOUT",r"timeout|timed out|deadline exceeded|超时|context deadline"),
           ("RATE_LIMIT",r"429|too many requests|rate limit|限速|频率限制"),
           ("AUTH_PERMISSION",r"401|403|unauthoriz|forbidden|permission denied|权限不足|认证失败"),
           ("UPSTREAM_5XX",r"502|503|504|bad gateway|server unavailable"),
           ("CONNECTION_RESET",r"reset by peer|connection reset|broken pipe|econnreset"),
           ("TLS",r"tls|ssl handshake|certificate"),
           ("DNS",r"no such host|dns|lookup .* failed|resolve"),
           ("EOF",r"unexpected eof|unexpected end of file"),
           ("STORAGE_FULL",r"no space left|enospc|磁盘空间"),
           ("FILE_NOT_FOUND",r"not found|404|no such file"),
           ("FILE_CONFLICT",r"conflict|same file|duplicate|already exist|replace failed"),
           ("NETWORK",r"connection|network|网络"),
           ("OTHER_FAILURE",r"error|failed|失败")):
            if re.search(expr,s):return name
           return "OTHER"
          def en(m,k):
           if k not in m.DESCRIPTOR.fields_by_name:return "N/A"
           d=m.DESCRIPTOR.fields_by_name[k]
           return d.enum_type.values_by_number[int(getattr(m,k))].name if d.type==14 else str(getattr(m,k))
          def h(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          apis=[a for q in rpc("GetAllCloudApis") for a in q.apis]
          def provider(a):
           t=(a.name+" "+a.path).lower()
           return "SFTP" if "sftp" in t else "BAIDU" if "baidu" in t or "百度" in t else "123PAN" if "123" in t else "OTHER"
          def by_path(p):
           matches=[(len(a.path),provider(a)) for a in apis if a.path and (p==a.path or p.startswith(a.path.rstrip("/")+"/"))]
           return max(matches)[1] if matches else "UNKNOWN"
          print("CLOUD_SOURCES",json.dumps(dict(collections.Counter(provider(a) for a in apis))))
          settings=rpc("GetSystemSettings")
          for x in settings:
           print("SPEED_LIMITS",json.dumps({"download_KiBps":x.maxDownloadSpeedKBytesPerSecond,"upload_KiBps":x.maxUploadSpeedKBytesPerSecond,"backupHighWater":getattr(x,"backupQueueHighWater",None),"backupLowWater":getattr(x,"backupQueueLowWater",None),"preprocessors":getattr(x,"maxPreProcessTasks",None),"processing":getattr(x,"maxProcessTasks",None)}))
          for r in rpc("GetAllTasksCount"):
           print("TASK_COUNTS",json.dumps({"upload":r.uploadCount,"download":r.downloadCount}))
          print("NETWORK_TELEMETRY_METHODS",[x.name for x in S.methods if any(t in x.name.lower() for t in ("network","traffic","speed","metrics","systeminfo","runtime","status","log"))][:110])
          for meth in ("GetRuntimeInfo",):
           if meth in S.methods_by_name:
            for msg in rpc(meth):
             print("RUNTIME_NUMERIC",json.dumps({f.name:round(float(v),3) for f,v in msg.ListFields() if f.type in (1,2,3,4,5,6,7,13,15,16,17,18) and isinstance(v,(int,float))}))
          backups=[b for resp in rpc("BackupGetAll") for b in resp.backups]
          print("BACKUP_TOTAL",len(backups))
          for i,b in enumerate(backups):
           root=b.backup.sourcePath
           req=cls(S.methods_by_name["BackupGetSyncIssues"].input_type)();req.value=root
           issues=[x for r in rpc("BackupGetSyncIssues",req) for x in r.issues if not x.resolved]
           source=by_path(root)
           dests=[]
           for d in b.backup.destinations:
            for f,v in d.ListFields():
             if f.type==f.TYPE_STRING and any(t in f.name.lower() for t in ("path","destination","target")) and v:
              dests.append(by_path(str(v)))
           print("BACKUP",json.dumps({"slot":i+1,"src":source,"destinations":dict(collections.Counter(dests)),"enabled":b.backup.isEnabled,"status":en(b,"status"),"openCounter":b.openSyncIssues,"returned":len(issues),"issueTypes":dict(collections.Counter(en(x,"kind") for x in issues)),"errors":len(b.errors),"errorClasses":dict(collections.Counter(classify(e.message) for e in b.errors)),"pendingSource":next((r.pendingChanges for r in b.replicaStatuses if r.isSource),0)},ensure_ascii=False),flush=True)
          ur=cls(S.methods_by_name["GetUploadFileList"].input_type)()
          ur.getAll=False;ur.itemsPerPage=200;ur.pageNumber=1
          ur0=rpc("GetUploadFileList",ur)
          for x in ur0:
           print("UPLOAD_META",json.dumps({"total":x.totalCount,"filtered":x.totalCountFiltered,"speedBytesPerSecond":round(x.globalBytesPerSecond,2),"finishedBytes":getattr(x,"finishedBytes",0),"totalBytes":getattr(x,"totalBytes",0),"sample":len(x.uploadFiles),"statuses":dict(collections.Counter(en(f,"statusEnum") for f in x.uploadFiles))}))
          fdesc=ur.DESCRIPTOR.fields_by_name.get("statusFilter")
          if fdesc and "FatalError" in fdesc.enum_type.values_by_name:
           ur.statusFilter=fdesc.enum_type.values_by_name["FatalError"].number
           for page in (1,2,3):
            ur.pageNumber=page
            try:
             ans=rpc("GetUploadFileList",ur)
             for x in ans:
              print("FATAL_UPLOAD",json.dumps({"page":page,"filteredTotal":x.totalCountFiltered,"returned":len(x.uploadFiles),"provider":dict(collections.Counter(by_path(f.destPath) for f in x.uploadFiles)),"errorTypes":dict(collections.Counter(classify(f.errorMessage) for f in x.uploadFiles)),"byProvider":dict(collections.Counter(by_path(f.destPath)+":"+classify(f.errorMessage) for f in x.uploadFiles))}),flush=True)
            except Exception as e:print("FATAL_PAGE_ERROR",page,type(e).__name__,h(str(e)),flush=True)
          else:print("NO_FATAL_FILTER")
          for r in rpc("GetDownloadFileList"):
           fs=r.downloadFiles
           print("DOWNLOAD",json.dumps({"sample":len(fs),"globalSpeedBps":round(r.globalBytesPerSecond,2),"nonzeroSpeed":sum(1 for f in fs if getattr(f,"bytesPerSecond",0)>0),"speedsBps":sorted([round(f.bytesPerSecond) for f in fs],reverse=True)[:7],"errorTypes":dict(collections.Counter(classify(getattr(f,"lastDownloadError","")) for f in fs)),"fileFields":[x.name for x in fs[0].DESCRIPTOR.fields] if fs else []}),flush=True)
          print("WAIT_FOR_SPEED_DELTA",flush=True)
          time.sleep(15)
          for meth in ("GetUploadFileList","GetDownloadFileList","GetAllTasksCount"):
           req=None
           if meth=="GetUploadFileList":
            req=cls(S.methods_by_name[meth].input_type)();req.getAll=False;req.itemsPerPage=100;req.pageNumber=1
           for x in rpc(meth,req):
            if meth=="GetUploadFileList":print("SPEED_T1_UPLOAD",json.dumps({"rateBytesSec":round(x.globalBytesPerSecond,2),"n":x.totalCount,"stats":dict(collections.Counter(en(v,"statusEnum") for v in x.uploadFiles))}))
            elif meth=="GetDownloadFileList":print("SPEED_T1_DOWNLOAD",json.dumps({"rateBytesSec":round(x.globalBytesPerSecond,2),"n":len(x.downloadFiles)}))
            else:print("COUNTS_T1",json.dumps({"upload":x.uploadCount,"download":x.downloadCount}))
          
          PY
          PYTHONPATH=/tmp/cd-current-audit python3 -u /tmp/cd-current-audit/audit.py
      - name: Measure hosted runner to VPS HTTPS small-object latency only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for i in 1 2 3; do
            curl --silent --show-error --output /dev/null --max-time 20 --write-out "RUNNER_TO_CD status=%{http_code} connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s bytes=%{size_download}\n" https://cd.evren.cn/ || true
          done
