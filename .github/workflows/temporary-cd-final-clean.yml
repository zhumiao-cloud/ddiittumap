name: Temporary cleanup for reviewed CloudDrive sync acknowledgment
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-final-clean.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Remove task runs and task artifacts, inspect remaining state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          for run in 38503648793 38504163600 38504201763 38504271984 38504375629; do
            for art in $(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '.artifacts[].id' 2>/dev/null || true); do
              if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${art}" >/dev/null 2>&1; then
                echo "ARTIFACT_REMOVED ${run}"
              else
                echo "ARTIFACT_DELETE_FAILED ${run}"
              fi
            done
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" >/dev/null 2>&1; then
              echo "RUN_REMOVED ${run}"
            else
              echo "RUN_DELETE_FAILED ${run}"
            fi
          done
          echo "BRANCHES"
          gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name'
          echo "CLEANUP_FINISHED"
