name: SXY verified finished Multiome FASTQ reclaim 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-arc-reclaim-20261013.yml']
permissions:
  contents: read
concurrency:
  group: sxy-arc-verified-fastq-reclaim
  cancel-in-progress: false
jobs:
  reclaim:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Remove only P10MK1_1 verified redundant local FASTQ after independent source size checks
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 11
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          umask 077
          test "$(id -un)" = h3039
          python3 - <<'PY'
          from pathlib import Path
          import os, json, subprocess, sys, re
          root=Path('/home/h3039/PROJECTS/zhumiao/multiome_arc_work')
          sample='P10MK1_1'
          base=root/sample
          outs=base/'pipeline'/sample/'outs'
          required=['filtered_feature_bc_matrix/matrix.mtx.gz',
          'filtered_feature_bc_matrix/features.tsv.gz',
          'filtered_feature_bc_matrix/barcodes.tsv.gz',
          'raw_feature_bc_matrix/matrix.mtx.gz',
          'raw_feature_bc_matrix/features.tsv.gz',
          'raw_feature_bc_matrix/barcodes.tsv.gz',
          'filtered_feature_bc_matrix.h5','raw_feature_bc_matrix.h5',
          'gex_possorted_bam.bam','gex_possorted_bam.bam.bai',
          'atac_possorted_bam.bam','atac_possorted_bam.bam.bai',
          'atac_fragments.tsv.gz','atac_fragments.tsv.gz.tbi']
          def guard(cond,msg):
              if not cond: raise RuntimeError('REFUSE_CLEANUP: '+msg)
          guard(base.is_dir() and not base.is_symlink(),'not genuine local target')
          guard(os.stat(base).st_uid==os.getuid(),'incorrect directory owner')
          guard(all((outs/f).is_file() and (outs/f).stat().st_size>0 for f in required),'missing official ARC data/BAM/index')
          guard((base/'P10MK1_1_seurat_multiome.rds').stat().st_size>100000000,'RDS missing')
          guard((base/'.postarc_rds_validated').is_file(),'RDS checkpoint missing')
          guard('PASS sample=P10MK1_1' in (base/'arc_validate_seurat.log').read_text(),'RDS validation not complete')
          guard('Pipestance completed successfully!' in (base/'cellranger_arc_console.log').read_text(),'ARC not complete')
          ps=subprocess.run(['ps','-u','h3039','-o','args='],stdout=subprocess.PIPE,check=True,text=True).stdout
          guard(not any('cellranger-arc count' in line and 'P10MK1_1' in line for line in ps.splitlines()),'P10MK1_1 count still running')
          candidates=[]
          for modality in ('GEX','ATAC'):
              d=base/'input'/modality
              guard(d.is_dir() and not d.is_symlink(),'missing or symlinked input/'+modality)
              files=list(d.iterdir())
              guard(all(f.is_file() and not f.is_symlink() and f.name.endswith('.fastq.gz') for f in files),'input contains unexpected file')
              guard(len(files)==(2 if modality=='GEX' else 16),'unexpected FASTQ count '+modality)
              cmd=['timeout','100','rclone','lsjson',f'danxibao3_webdav:{sample}/{modality}','--files-only']
              out=subprocess.run(cmd,capture_output=True,text=True,timeout=110)
              guard(out.returncode==0,'source listing unavailable for '+modality)
              source={item['Name']:item['Size'] for item in json.loads(out.stdout)}
              for f in files:
                  guard(f.name in source and source[f.name] == f.stat().st_size and source[f.name]>0,'source file size does not match for '+modality)
                  candidates.append(f)
          guard(len(candidates)==18,'not exactly 18 redundant input files')
          before=sum(f.stat().st_size for f in candidates)
          print('VERIFIED_REDUNDANT_FILES=',len(candidates),'BYTES=',before,flush=True)
          for f in candidates:
              guard(str(f.parent) in (str(base/'input'/'GEX'),str(base/'input'/'ATAC')),'unexpected deletion path')
              f.unlink()
          print('P10MK1_1_LOCAL_FASTQ_CLEANUP_PASS_FILES=',len(candidates),'RECLAIMED_BYTES=',before,flush=True)
          print('OFFICIAL_ARC_OUTS_AND_RDS_PRESERVED=YES',flush=True)
          PY
          df -h /home/h3039/PROJECTS/zhumiao/multiome_arc_work
          systemctl --user show sxy-mmul10-multiome-local-two-v2-20261013.service -p ActiveState -p MainPID -p Result
          echo FINISHED_FASTQ_RECLAIM_COMPLETE
          REMOTE
          unset SSHPASS SXY_PSWD
