name: SXY ARC Seurat uncompressed native RDS recovery v4 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-arc-recovery-v4-20261013.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Atomically install corrected indexed-feature validator and restart failed recovery
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 9
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          umask 077
          test "$(id -un)" = h3039
          BASE=/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner
          PREV=sxy-mmul10-multiome-recovery-v3-20261013.service
          prevstate=$(systemctl --user show "$PREV" -p ActiveState --value 2>/dev/null || :)
          echo "PREV_SERVICE=$prevstate"
          T=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1
          if [ -s "$T/.postarc_rds_validated" ]; then
            echo P10_RDS_ALREADY_VALIDATED_LEAVE_RUNNING
            exit 0
          fi
          if ps -u h3039 -o args= | grep -Eq '[c]ellranger-arc count'; then
            echo ARC_COUNT_ALREADY_RUNNING_DO_NOT_INTERRUPT
            exit 0
          fi
          if [ "$prevstate" = active ] || [ "$prevstate" = activating ]; then
            echo STOP_SLOW_SINGLE_THREAD_XZ_RDS_VALIDATOR_ONLY
            systemctl --user stop "$PREV"
          fi
          if ps -u h3039 -o args= | grep -Eq '[c]ellranger-arc count|[R]script.*arc_validate_seurat'; then
            echo STOP_CONCURRENT_COUNT_OR_VALIDATION
            exit 34
          fi
          test -s "$BASE/sxy_multiome_recovery_20261013.sh"
          test -s "$BASE/arc_validate_seurat.R"
          cat > "$BASE/arc_validate_seurat.R.next" <<'NEW_VALIDATOR'
          #!/usr/bin/env Rscript
          # Cell Ranger ARC 2.2.0 官方 10x MEX 严格校验与 Seurat/Signac 对象构建
          # 使用: Rscript scripts/arc_validate_seurat.R /path/to/ARC/outs SAMPLE /path/to/output.rds
          # 禁止静默修改 features.tsv.gz、barcodes.tsv.gz 或矩阵中的基因/细胞顺序。
          
          suppressPackageStartupMessages({
            library(Matrix)
            library(Seurat)
            library(Signac)
          })
          
          args <- commandArgs(trailingOnly=TRUE)
          stopifnot(length(args) == 3L)
          outs <- normalizePath(args[[1]], mustWork=TRUE)
          sample <- args[[2]]
          rds <- args[[3]]
          stopifnot(grepl("^[A-Za-z0-9_-]+$", sample))
          matrix_dir <- file.path(outs, "filtered_feature_bc_matrix")
          required_mex <- c("matrix.mtx.gz", "features.tsv.gz", "barcodes.tsv.gz")
          for (file in required_mex) {
            if (!file.exists(file.path(matrix_dir, file))) stop("缺少官方 MEX 文件：", file)
          }
          required_outputs <- c("gex_possorted_bam.bam", "gex_possorted_bam.bam.bai",
                                "atac_possorted_bam.bam", "atac_possorted_bam.bam.bai",
                                "atac_fragments.tsv.gz", "atac_fragments.tsv.gz.tbi",
                                "filtered_feature_bc_matrix.h5", "raw_feature_bc_matrix.h5")
          for (file in required_outputs) {
            p <- file.path(outs, file)
            if (!file.exists(p) || file.info(p)$size == 0) stop("官方关键输出缺失或为空：", file)
          }
          
          read_tsv <- function(path, expected_cols) {
            x <- utils::read.delim(gzfile(path), header=FALSE, sep="\t",
                                   quote="", comment.char="", check.names=FALSE,
                                   stringsAsFactors=FALSE)
            if (!ncol(x) %in% expected_cols) stop("TSV 列数异常：", path, "; 实际列数=", ncol(x), "; 允许列数=", paste(expected_cols, collapse="/"))
            x
          }
          feat <- read_tsv(file.path(matrix_dir, "features.tsv.gz"), c(3L, 6L))
          message("官方 features.tsv.gz 列数：", ncol(feat), "（前3列用于 ID/名称/模态识别，原始文件不改动）")
          bc <- read_tsv(file.path(matrix_dir, "barcodes.tsv.gz"), 1L)[[1]]
          if (anyNA(feat) || anyNA(bc) || anyDuplicated(bc)) stop("features/barcodes 存在 NA 或重复条码")
          feature_types <- feat[[3]]
          if (!setequal(unique(feature_types), c("Gene Expression","Peaks")))
            stop("发现未知或缺失的模态类型，必须人工检查 features.tsv.gz")
          rna_idx <- which(feature_types == "Gene Expression")
          atac_idx <- which(feature_types == "Peaks")
          if (anyDuplicated(feat[[1]][rna_idx]) || anyDuplicated(feat[[1]][atac_idx]))
            stop("官方 feature ID 存在重复，禁止自动改名后冒充原始顺序")
          
          # gene.column=1 使用稳定的 feature ID，不采用可能重复的基因 symbol；
          # unique.features=FALSE 确保不因自动修复重名而改变特征名。
          mats <- Seurat::Read10X(data.dir=matrix_dir, gene.column=1, unique.features=FALSE)
          if (!is.list(mats) || !setequal(names(mats), c("Gene Expression","Peaks")))
            stop("Read10X 未正确识别 Gene Expression 与 Peaks 两类特征")
          rna <- mats[["Gene Expression"]]
          atac <- mats[["Peaks"]]
          
          # ARC 六列 features 时，Seurat 5.3.0 的 Read10X 在 unique.features=FALSE
          # 下实际返回无行名的 dgCMatrix。仅在未附加行名且维度吻合时，
          # 将官方 features.tsv.gz 的对应行 ID 按原始索引赋回；不修改 count 或排序。
          verify_attach_original_ids <- function(x, ids, barcodes, modality) {
            if (nrow(x) != length(ids) || ncol(x) != length(barcodes))
              stop(modality, " 的维度与官方 features/barcodes 不匹配")
            if (is.null(rownames(x))) {
              rownames(x) <- ids
              message(modality, ": Read10X 返回 NULL 行名；按官方 features 索引附加行名")
            }
            if (is.null(colnames(x))) {
              colnames(x) <- barcodes
              message(modality, ": Read10X 返回 NULL 列名；按官方 barcodes 索引附加列名")
            }
            if (!identical(rownames(x), ids))
              stop(modality, " 行与官方 features.tsv.gz 顺序不一致")
            if (!identical(colnames(x), barcodes))
              stop(modality, " 列与官方 barcodes.tsv.gz 顺序不一致")
            x
          }
          rna <- verify_attach_original_ids(rna, feat[[1]][rna_idx], bc, "RNA")
          atac <- verify_attach_original_ids(atac, feat[[1]][atac_idx], bc, "ATAC")
          if (nrow(rna) == 0L || nrow(atac) == 0L || ncol(rna) == 0L)
            stop("RNA/ATAC 矩阵维度不合法")
          if (any(rna@x < 0) || any(atac@x < 0) || any(!is.finite(rna@x)) || any(!is.finite(atac@x)))
            stop("count 矩阵包含负值或非有限数值")
          if (any(rna@x != round(rna@x)) || any(atac@x != round(atac@x)))
            stop("原始 count 矩阵含非整数值")
          message("Read10X 与官方 features/barcodes 的行列顺序验证通过。")
          
          # 正常 ATAC peak ID 为 contig:start-end；不得在未知染色体命名格式下擅自修改。
          if (!all(grepl("^[^:]+:[0-9]+-[0-9]+$", rownames(atac))))
            stop("ATAC 峰的坐标格式无法识别")
          obj <- Seurat::CreateSeuratObject(counts=rna, project=sample,
                                            min.cells=0, min.features=0)
          if (!identical(colnames(obj), colnames(atac)))
            stop("Seurat RNA 与 ATAC 细胞顺序不一致")
          # ARC 2.2.0 官方 fragments 带 340 行 # 注释并使用 6 列（第六列为链）。
          # 当前服务器 Signac 1.14.9002 的 CreateFragmentObject 拒绝该格式。
          # 为保证 RDS 在本地暂存目录释放后仍可移植，不写入会失效的临时 fragments 绝对路径。
          # RNA/ATAC 原始计数全部保留；官方六列 fragments、tbi 与 BAM 随 outs 完整归档。
          obj[["ATAC"]] <- Signac::CreateChromatinAssay(
            counts=atac, sep=c(":", "-"), min.cells=0, min.features=0
          )
          obj@misc$arc_fragments_relative_file <- "outs/atac_fragments.tsv.gz"
          obj@misc$arc_fragments_index_relative_file <- "outs/atac_fragments.tsv.gz.tbi"
          obj@misc$arc_fragments_linked <- FALSE
          obj@misc$arc_fragments_note <- "Official ARC 2.2.0 six-column fragments preserved unchanged; attach with compatible Signac after relocating RDS."
          message("ATAC counts assay PASS; official 6-column fragments retained in outs, not linked to portable RDS.")
          obj$sample <- sample
          obj$source_pipeline <- "cellranger-arc 2.2.0"
          obj$matrix_type <- "filtered_feature_bc_matrix"
          if (!identical(colnames(obj[["RNA"]]), colnames(obj[["ATAC"]])))
            stop("保存前再次检查发现 RNA/ATAC 细胞条形码不一致")
          dir.create(dirname(rds), recursive=TRUE, showWarnings=FALSE)
          # 无损原生 RDS，无压缩可避免单线程 xz 压缩成为 125M 非零条目的耗时瓶颈。
          saveRDS(obj, file=rds, compress=FALSE)
          # 重新加载保存结果，避免产生无法解码的损坏 RDS。
          check <- readRDS(rds)
          if (!identical(colnames(check[["RNA"]]), bc) ||
              !identical(colnames(check[["ATAC"]]), bc))
            stop("保存后重新读取的 Seurat 对象条码发生变化")
          if (!identical(rownames(check[["RNA"]]), feat[[1]][rna_idx]) ||
              !identical(rownames(check[["ATAC"]]), feat[[1]][atac_idx]))
            stop("保存后重新读取的 Seurat 对象特征 ID/顺序发生变化")
          cat(sprintf("PASS sample=%s rna_genes=%d peaks=%d cells=%d rds=%s\n",
                      sample, nrow(rna), nrow(atac), length(bc), rds))
          NEW_VALIDATOR
          Rscript -e 'invisible(parse(file="/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/arc_validate_seurat.R.next")); cat("R_PARSER_PASS\n")'
          mv -f "$BASE/arc_validate_seurat.R.next" "$BASE/arc_validate_seurat.R"
          chmod 600 "$BASE/arc_validate_seurat.R"
          grep -Fq 'verify_attach_original_ids' "$BASE/arc_validate_seurat.R"
          echo VALIDATOR_EXACT_INDEX_PATCH_DEPLOYED
          systemd-run --user --unit=sxy-mmul10-multiome-recovery-v4-20261013 \
            --description="Resume safe ARC with lossless uncompressed portable RDS" \
            /usr/bin/bash "$BASE/sxy_multiome_recovery_20261013.sh"
          sleep 5
          systemctl --user show sxy-mmul10-multiome-recovery-v4-20261013.service -p MainPID -p ActiveState -p SubState -p Result
          journalctl --user -u sxy-mmul10-multiome-recovery-v4-20261013.service -n 10 --no-pager --output=cat | cut -c1-240
          echo DEPLOY_V4_PASS
          REMOTE
          unset SSHPASS SXY_PSWD
