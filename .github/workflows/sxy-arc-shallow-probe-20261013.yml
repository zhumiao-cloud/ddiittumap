name: SXY ARC WebDAV shallow directory probe
on:
  push:
    paths:
      - '.github/workflows/sxy-arc-shallow-probe-20261013.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check nonrecursive WebDAV PROPFIND listing under 30 seconds
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass >/dev/null
          install -d -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=20 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "AUDIT=$(date -Is)"
          python3 - <<'PY'
          import subprocess,json,time
          src='danxibao3_webdav:P10MK2/ATAC'
          t=time.monotonic()
          try:
            p=subprocess.run(['rclone','lsjson',src,'--files-only'],text=True,capture_output=True,timeout=35)
            print('SHALLOW_PROBE_RETURN_CODE=',p.returncode, 'DURATION_S=',round(time.monotonic()-t,2),flush=True)
            if p.returncode == 0:
              a=json.loads(p.stdout)
              print('SHALLOW_PROBE_COUNT=',len(a),'BYTES=',sum(x['Size'] for x in a),flush=True)
            else:
              print('SHALLOW_PROBE_STDERR_TAIL=',p.stderr[-400:],flush=True)
          except subprocess.TimeoutExpired:
            print('SHALLOW_PROBE_TIMEOUT_35S',flush=True)
          PY
          echo '=== ORIGINAL_PREFLIGHT ==='
          systemctl --user show sxy-mmul10-multiome-local-two-v3-20261013.service -p ActiveState -p MainPID
          ps -u h3039 -o pid=,state=,comm=,args= | grep -E '[r]clone (lsf|copy)' | cut -c1-240 | head -8 || true
          echo 'SHALLOW_READONLY_DONE'
          REMOTE
          unset SSHPASS SXY_PSWD