name: SXY sc read-only status snapshot once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sxy-sc-readonly-snapshot-once.yml'
permissions:
  contents: read
concurrency:
  group: sxy-sc-public-readonly-snapshot-once
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read-only aggregate server analysis status
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || { echo 'SECRET_NOT_CONFIGURED'; exit 10; }
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          WORK=/tmp/sxy_sc_local_split_38026688443_1
          ROOT="$HOME/PROJECTS/zhumiao/danxibao"
          echo "UTC_NOW=$(date -u +%FT%TZ)"
          echo "=== LOCAL PROCESSING ==="
          for org in human mice; do
            log="$WORK/logs/expanded_${org}.log"
            qc="$WORK/output/expanded_run/QC_by_sample/$org"
            rds="$WORK/output/expanded_run/seurobj-${org}/seurobj-${org}.rds"
            echo "SPECIES=$org"
            if test -d "$qc"; then
              printf 'QC_RDS_COUNT='; find "$qc" -type f -name 07_seurat_cleaned.rds | wc -l
              printf 'QC_EXCLUDED_COUNT='; find "$qc" -type f -name QC_EXCLUDED.txt | wc -l
            else echo 'QC_DIR=MISSING'; fi
            if test -f "$log"; then
              stat -c 'LOG_LAST_MODIFIED=%y' "$log"
              if grep -qx STRICT_INTEGRATION_COMPLETE "$log"; then echo 'COMPLETE_MARKER=YES'; else echo 'COMPLETE_MARKER=NO'; fi
              if grep -q 'Error in\|Execution halted\|Error:' "$log"; then echo 'ERROR_MARKER=YES'; else echo 'ERROR_MARKER=NO'; fi
            else echo 'LOG=MISSING'; fi
            if test -s "$rds"; then stat -c 'LOCAL_FINAL_RDS_BYTES=%s' "$rds"; else echo 'LOCAL_FINAL_RDS=MISSING'; fi
          done
          echo '=== INPUT METADATA ==='
          manifest="$WORK/output/config/sample_metadata_verified_expanded.tsv"
          if test -s "$manifest"; then printf 'VERIFIED_MANIFEST_ROWS='; expr "$(wc -l < "$manifest")" - 1; else echo 'VERIFIED_MANIFEST=MISSING'; fi
          echo '=== SERVER R PROCESS ==='
          printf 'INTEGRATION_R_PROCESSES='
          ps -eo args= | grep -Ec '^/usr/lib/R/bin/exec/R .*integrate_danxibao_species_(human|mice)\.R' || true
          echo '=== DESTINATION ==='
          dest="$ROOT/输出文件夹/单细胞_严格元数据整合/accelerated_run/expanded_run"
          printf 'MOUNT_FSTYPE='; findmnt -n -o FSTYPE -T "$ROOT" || true
          if timeout 15 stat -L "$ROOT/输出文件夹" >/dev/null 2>&1; then echo 'ROOT_OUTPUT_STAT=PASS'; else echo 'ROOT_OUTPUT_STAT=FAIL'; fi
          if timeout 15 stat -L "$dest" >/dev/null 2>&1; then echo 'FINAL_DEST_STAT=PASS'; else echo 'FINAL_DEST_STAT=FAIL'; fi
          for org in human mice;do
            f="$dest/seurobj-${org}/seurobj-${org}.rds"
            if timeout 15 test -s "$f" 2>/dev/null; then echo "REMOTE_RDS_$org=YES"; else echo "REMOTE_RDS_$org=NO_OR_UNAVAILABLE";fi
          done
          echo 'READONLY_SNAPSHOT_DONE'
          REMOTE
          unset SSHPASS SXY_PSWD
