name: SXY multiome3 ARC control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sxy-multiome3-control.yml'
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Inspect and safely resume existing ARC service
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          RUNNER="$HOME/PROJECTS/zhumiao/.multiome_arc_runner"
          UNIT=sxy-mmul10-multiome-arc-20261010
          REF="$HOME/reference/Mmul_10_Ensembl113_ARC220"
          WORK="$HOME/PROJECTS/zhumiao/multiome_arc_work"
          OUT="$HOME/PROJECTS/zhumiao/danxibao3/整理转换文件"

          echo "=== PRECHECK ==="
          test -s "$RUNNER/sxy_mmul10_arc_build_and_run.sh"
          test -s "$RUNNER/arc_multiome_three_samples.sh"
          test -s "$RUNNER/arc_validate_seurat.R"
          echo RUNNER_FILES=PASS

          echo "=== SERVICE_BEFORE ==="
          systemctl --user show "$UNIT" -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager 2>/dev/null || true
          echo "=== PROCESS_BEFORE ==="
          ps -u h3039 -o pid,ppid,etime,%cpu,%mem,rss,args --sort=-%cpu | grep -E '[c]ellranger-arc|[c]url.*Mmul_10|[r]clone.*danxibao3|[g]zip -t|[p]igz|[s]xy_mmul10_arc_build_and_run|[a]rc_multiome_three_samples' | head -n 40 || true

          echo "=== REFERENCE_STATE ==="
          test -f "$REF/reference.json" && { echo REFERENCE_READY=YES; python3 - "$REF/reference.json" <<'PY'
import json,sys
j=json.load(open(sys.argv[1]))
for k in ("genomes","organism","assembly","version"):
    if k in j: print(f"{k}={j[k]}")
PY
          } || echo REFERENCE_READY=NO
          ls -lh "$HOME/reference/.Mmul_10_Ensembl113_ARC220_build/inputs" 2>/dev/null || true

          echo "=== SAMPLE_STATE ==="
          for s in P10MK1_1 P10MK2 P20MK3; do
            printf '%s ' "$s"
            if [ -s "$OUT/$s/.fully_verified" ]; then
              echo VERIFIED
            elif [ -d "$WORK/$s" ]; then
              du -sh "$WORK/$s" 2>/dev/null | awk '{print "WORKING_LOCAL="$1}'
            elif [ -d "$OUT/$s" ]; then
              echo REMOTE_PARTIAL
            else
              echo NOT_STARTED
            fi
          done

          echo "=== JOURNAL_TAIL ==="
          journalctl --user -u "$UNIT" --no-pager --output=cat -n 120 2>/dev/null | tail -n 120 || true

          state="$(systemctl --user show "$UNIT" -p ActiveState --value 2>/dev/null || true)"
          result="$(systemctl --user show "$UNIT" -p Result --value 2>/dev/null || true)"
          if [ "$state" != active ]; then
            echo "SERVICE_NOT_ACTIVE state=$state result=$result"
            systemctl --user reset-failed "$UNIT" 2>/dev/null || true
            if systemctl --user show "$UNIT" -p LoadState --value 2>/dev/null | grep -qx loaded; then
              systemctl --user restart "$UNIT"
              echo SERVICE_ACTION=RESTARTED
            else
              systemd-run --user --unit="$UNIT" --description="Mmul10 ARC reference plus three Multiome conversions" /usr/bin/bash "$RUNNER/sxy_mmul10_arc_build_and_run.sh"
              echo SERVICE_ACTION=STARTED
            fi
            sleep 5
          else
            echo SERVICE_ACTION=UNCHANGED_ACTIVE
          fi

          echo "=== SERVICE_AFTER ==="
          systemctl --user show "$UNIT" -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          echo "=== DISK ==="
          df -hT "$HOME" | tail -n 1
          echo CONTROL_PASS
          REMOTE
          unset SSHPASS SXY_PSWD
