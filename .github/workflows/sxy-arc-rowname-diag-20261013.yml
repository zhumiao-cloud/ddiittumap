name: SXY ARC Read10X identity diagnostic 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-arc-rowname-diag-20261013.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Identify exact RNA and ATAC rowname discrepancies without changing source
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || exit 9
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          D=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1/pipeline/P10MK1_1/outs/filtered_feature_bc_matrix
          test -s "$D/matrix.mtx.gz"
          Rscript - "$D" <<'RS'
          suppressPackageStartupMessages(library(Seurat))
          d <- commandArgs(trailingOnly=TRUE)[1]
          f <- read.delim(gzfile(file.path(d,"features.tsv.gz")), header=FALSE, sep="\t", quote="", comment.char="", stringsAsFactors=FALSE, check.names=FALSE)
          cat("FEATURE_COLUMN_CLASSES=",paste(vapply(f,class,character(1)),collapse=","),"\n")
          cat("FEATURE_TYPES=",paste(names(table(f[[3]])),as.integer(table(f[[3]])),collapse=";"),"\n")
          x <- Seurat::Read10X(d, gene.column=1, unique.features=FALSE)
          cat("MODALITIES=",paste(names(x),collapse=","),"\n")
          for (type in c("Gene Expression","Peaks")) {
            if (!(type %in% names(x))) next
            a <- rownames(x[[type]])
            b <- f[[1]][which(f[[3]]==type)]
            cat("TYPE=",type," DIM=",nrow(x[[type]]),"x",ncol(x[[type]])," EXPECTED=",length(b)," EXACT=",identical(a,b)," SAME_LENGTH=",length(a)==length(b),"\n",sep="")
            cat("FIRST_ACTUAL=",paste(head(a,3),collapse="|"),"\n")
            cat("FIRST_EXPECTED=",paste(head(b,3),collapse="|"),"\n")
            mismatch <- which(a != b)
            cat("DIFF_COUNT=",length(mismatch),"\n")
            if(length(mismatch))for(i in head(mismatch,8))cat("DIFF_IDX=",i," ACTUAL=",a[[i]]," EXPECTED=",b[[i]],"\n",sep="")
            cat("SAME_SET=",setequal(a,b)," DUP_ACTUAL=",anyDuplicated(a)," DUP_EXPECTED=",anyDuplicated(b),"\n",sep="")
          }
          cat("FEATURE_DIAG_FINISHED\n")
          RS
          REMOTE
          unset SSHPASS SXY_PSWD
