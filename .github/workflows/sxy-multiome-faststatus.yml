name: SXY multiome ARC fast status
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-faststatus.yml'
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read local ARC progress
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          unit=sxy-mmul10-multiome-arc-20261010
          echo "NOW=$(date -Is)"
          systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          work="$HOME/PROJECTS/zhumiao/multiome_arc_work"
          for s in P10MK1_1 P10MK2 P20MK3; do
            d="$work/$s"
            echo "SAMPLE=$s"
            du -sh "$d" 2>/dev/null || true
            if [ -d "$d/input" ]; then
              find "$d/input" -type f -printf '%P|%s\n' 2>/dev/null | sort | tail -n 40
            fi
            if [ -s "$d/cellranger_arc_console.log" ]; then
              echo LOGTAIL
              tail -n 25 "$d/cellranger_arc_console.log"
            fi
          done
          echo PROCESSES
          ps -u h3039 -o pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu 2>/dev/null | grep -E 'arc_multiome|cellranger-arc|martian|STAR|rclone copy danxibao3_webdav:P10MK' | grep -v grep | head -n 50 || true
          df -hT "$HOME" | tail -n 1
          REMOTE
          unset SSHPASS SXY_PSWD
