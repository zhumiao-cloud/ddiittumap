name: SXY multiome ARC fast status
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-faststatus.yml'
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read local ARC progress
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          unit=sxy-mmul10-multiome-arc-20261010
          resume=sxy-multiome-gex-resume-20261011
          echo "NOW=$(date -Is)"
          echo MAIN_UNIT
          systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          echo RESUME_UNIT
          systemctl --user show "$resume" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager 2>/dev/null || true
          echo RESUME_CHUNKS
          find "$HOME/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1/.resume_chunks" -type f -name 'chunk.*' -printf '%s\n' 2>/dev/null | awk '{n++;s+=$1} END{printf "chunks=%d bytes=%d\n",n+0,s+0}'
          echo RESUME_JOURNAL
          journalctl --user -u "$resume" --no-pager --output=cat -n 40 2>/dev/null | tail -n 40 || true
          work="$HOME/PROJECTS/zhumiao/multiome_arc_work"
          for s in P10MK1_1 P10MK2 P20MK3; do
            d="$work/$s"
            echo "SAMPLE=$s"
            du -sh "$d" 2>/dev/null || true
            if [ -d "$d/input" ]; then
              find "$d/input" -type f -printf '%P|%s\n' 2>/dev/null | sort | tail -n 40
            fi
            if [ "$s" = P10MK1_1 ] && [ -s "$d/input/GEX/md5.md5" ]; then
              echo GEX_MD5_MANIFEST
              cat "$d/input/GEX/md5.md5"
            fi
            if [ -s "$d/cellranger_arc_console.log" ]; then
              echo LOGTAIL
              tail -n 25 "$d/cellranger_arc_console.log"
            fi
          done
          echo REMOTE_GEX_SIZES_WITH_PROXY
          export HTTPS_PROXY=http://127.0.0.1:19324
          export https_proxy=http://127.0.0.1:19324
          timeout 30 rclone lsl 'danxibao3_webdav:P10MK1_1/GEX' 2>/dev/null | grep -E 'P10-zc_S1_L001_R[12]_001.fastq.gz' || true
          unset HTTPS_PROXY https_proxy
          echo RCLONE_COPY_PROXY_ENV
          pid="$(pgrep -f 'rclone copy danxibao3_webdav:P10MK1_1/GEX' | head -n1 || true)"
          if [ -n "$pid" ] && [ -r "/proc/$pid/environ" ]; then
            tr '\0' '\n' < "/proc/$pid/environ" | grep -E '^(HTTPS_PROXY|https_proxy)=' || echo PROXY_ENV_MISSING
          fi
          echo PROCESSES
          ps -u h3039 -o pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu 2>/dev/null | grep -E 'arc_multiome|cellranger-arc|martian|STAR|rclone copy danxibao3_webdav:P10MK' | grep -v grep | head -n 50 || true
          df -hT "$HOME" | tail -n 1
          REMOTE
          unset SSHPASS SXY_PSWD

# refresh=2026-10-11T17:04:00+08:00
