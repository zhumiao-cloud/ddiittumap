name: SXY multiome ARC fast status
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-faststatus.yml'
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read local ARC progress
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          unit=sxy-mmul10-multiome-arc-20261010
          resume=sxy-multiome-gex-resume-20261011
          echo "NOW=$(date -Is)"
          echo MAIN_UNIT
          systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager 2>/dev/null || true
          echo RESUME_UNIT
          systemctl --user show "$resume" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager 2>/dev/null || true
          work="$HOME/PROJECTS/zhumiao/multiome_arc_work"
          ref="$HOME/reference/Mmul_10_Ensembl113_ARC220"
          test -s "$ref/reference.json" && echo REFERENCE_READY=YES || echo REFERENCE_READY=NO
          for s in P10MK1_1 P10MK2 P20MK3; do
            d="$work/$s"
            out="$HOME/PROJECTS/zhumiao/danxibao3/整理转换文件/$s"
            echo "SAMPLE=$s"
            [ -d "$d" ] && du -sh "$d" 2>/dev/null || true
            printf "LOCAL_FASTQ_COUNT="; find "$d/input" -type f -name '*.fastq.gz' 2>/dev/null | wc -l
            printf "LOCAL_FASTQ_GIB="; find "$d/input" -type f -name '*.fastq.gz' -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{printf "%.3f\n",s/1073741824}'
            if [ -s "$d/cellranger_arc_console.log" ]; then
              echo LOGTAIL
              tail -n 35 "$d/cellranger_arc_console.log"
            fi
            if [ -d "$d/pipeline/$s/outs" ]; then
              echo OUTS_LOCAL=YES
              find "$d/pipeline/$s/outs" -maxdepth 1 -type f -printf '%f|%s\n' 2>/dev/null | sort | head -n 50
            else
              echo OUTS_LOCAL=NO
            fi
            if timeout 20 rclone lsf "danxibao3_webdav:整理转换文件/$s" --files-only 2>/dev/null | grep -Fxq '.fully_verified'; then echo REMOTE_VERIFIED=YES; else echo REMOTE_VERIFIED=NO; fi
          done
          echo PROCESSES
          ps -u h3039 -o pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu 2>/dev/null | grep -E 'arc_multiome|cellranger-arc|martian|STAR|rclone copy danxibao3_webdav:P10|sxy-multiome-gex-resume' | grep -v grep | head -n 60 || true
          echo DISK
          df -hT "$HOME" | tail -n 1
          REMOTE
          unset SSHPASS SXY_PSWD
