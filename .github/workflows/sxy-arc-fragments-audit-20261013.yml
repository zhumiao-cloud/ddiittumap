name: SXY ARC official fragments format inspect 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-arc-fragments-audit-20261013.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Inspect official gzip fragments first records and tabix availability read-only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || exit 9
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          F=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1/pipeline/P10MK1_1/outs/atac_fragments.tsv.gz
          test -s "$F"
          python3 - "$F" <<'PY'
          import sys,gzip,collections
          f=sys.argv[1]
          dist=collections.Counter()
          with gzip.open(f,'rt') as h:
              for i in range(250):
                  line=h.readline()
                  if not line: break
                  col=line.rstrip('\r\n').split('\t')
                  dist[len(col)]+=1
                  if i<8:
                      print('FRAGMENT_RECORD=',i+1,'NCOL=',len(col),'FIELDS=',repr(col[:9]))
          print('FIRST_250_COLUMN_COUNTS=',dict(dist))
          PY
          stat -c 'FILE_BYTES=%s FILE=%n' "$F" "$F.tbi"
          echo '=== TOOLS ==='
          command -v tabix || true
          command -v bgzip || true
          command -v samtools || true
          echo FRAGMENT_FORMAT_AUDIT_PASS
          REMOTE
          unset SSHPASS SXY_PSWD
