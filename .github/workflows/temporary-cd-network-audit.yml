name: Temporary CloudDrive network and transfers read-only audit
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-network-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Read-only CloudDrive queues and 1Panel network metrics
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
          PANEL_KEY: ${{ secrets.PANEL_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          if [ -n "$PANEL_KEY" ]; then echo "::add-mask::$PANEL_KEY"; fi
          umask 077
          trap 'rm -rf /tmp/cd-audit-20261014' EXIT
          mkdir -p /tmp/cd-audit-20261014
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-audit-20261014/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-audit-20261014 --python_out=/tmp/cd-audit-20261014 /tmp/cd-audit-20261014/clouddrive.proto
          cat >/tmp/cd-audit-20261014/audit.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          
          
          import collections,time,hashlib,json,re,urllib.request,urllib.error
          def enum(m,f):
           d=m.DESCRIPTOR.fields_by_name[f];return d.enum_type.values_by_number[int(getattr(m,f))].name if d.type==14 else str(getattr(m,f))
          def sha(t):return hashlib.sha256(str(t).encode()).hexdigest()[:10]
          def safe_counts(xs):
           return dict(collections.Counter(xs))
          def brief(m,depth=0):
           if depth>1:return "COMPLEX"
           ans={}
           for f,v in m.ListFields():
            k=f.name
            if f.is_repeated:ans[k+"_count"]=len(v);continue
            if f.type==f.TYPE_MESSAGE:ans[k]=brief(v,depth+1);continue
            if f.type==f.TYPE_ENUM:ans[k]=f.enum_type.values_by_number[int(v)].name;continue
            if f.type==f.TYPE_BOOL:ans[k]=bool(v);continue
            if f.type in (f.TYPE_INT32,f.TYPE_UINT32,f.TYPE_INT64,f.TYPE_UINT64,f.TYPE_FLOAT,f.TYPE_DOUBLE):
             ans[k]=round(v,2) if isinstance(v,float) else int(v);continue
            if any(x in k.lower() for x in ("status","speed","state")) and isinstance(v,str):
             ans[k]=v[:60] if re.fullmatch(r"[A-Za-z0-9_ .-]+",v) else "REDACTED"
           return ans
          def classify(s):
           s=str(s).lower()
           matches=[("TIMEOUT",r"time.?out|超时|deadline exceeded|context deadline"),
           ("DNS",r"dns|resolve|name or service not known|域名"),
           ("CONNECTION_RESET",r"reset by peer|connection reset|broken pipe|econnreset|连接重置"),
           ("CONNECTION_REFUSED",r"refused|econnrefused|拒绝连接"),
           ("RATE_LIMIT",r"429|too many requests|rate limit|限速|频率限制"),
           ("UPSTREAM_5XX",r"\b50[0-9]\b|\b52[0-9]\b|bad gateway"),
           ("AUTH",r"401|403|unauthoriz|forbidden|permission denied|无权限|认证失败"),
           ("IO_DISK",r"no space left|input/output error|enospc|eio|磁盘已满"),
           ("HASH_CONFLICT",r"checksum|hash mismatch|not comparable|conflict|different|replace failed"),
           ("NOT_FOUND",r"404|not found|no such|不存在"),
           ("OWNER",r"owner marker|another instance|sync.owner|另一个实例")]
           for name,pattern in matches:
            if re.search(pattern,s):return name
           return "OTHER"
          def benchmark(method,req=None):
           t=time.perf_counter();res=rpc(method,req);return res,round((time.perf_counter()-t)*1000)
          print("DIAGNOSTIC_BEGIN")
          watch=["GetSystemSettings","GetAllTasksCount","GetRuntimeInfo","BackupGetAll","GetUploadFileList","GetDownloadFileList","GetAllCloudApis"]
          for method in watch:
           if method not in S.methods_by_name:continue
           desc=S.methods_by_name[method]
           print("METHOD_SCHEMA",method,{"inputs":[(f.name,str(f.type),f.is_repeated) for f in desc.input_type.fields],
           "outputs":[(f.name,str(f.type),f.is_repeated) for f in desc.output_type.fields]})
          for method in ("GetSystemSettings","GetAllTasksCount","GetRuntimeInfo"):
           if method in S.methods_by_name:
            try:
             out,ms=benchmark(method)
             print("TELEMETRY",method,json.dumps({"latencyMs":ms,"results":[brief(x) for x in out]},ensure_ascii=False))
            except Exception as e:print("TELEMETRY_ERROR",method,type(e).__name__,sha(str(e)))
          apis,_=benchmark("GetAllCloudApis")
          api_list=[x for r in apis for x in r.apis]
          print("CLOUD_API_TYPES",json.dumps(safe_counts(
           ("SFTP" if "sftp" in (x.name+" "+x.path).lower() else
           "BAIDU" if "baidu" in (x.name+" "+x.path).lower() or "百度" in x.name else
           "123PAN" if "123" in (x.name+" "+x.path).lower() else
           "OTHER") for x in api_list),ensure_ascii=False))
          backups,_=benchmark("BackupGetAll")
          bks=[x for r in backups for x in r.backups]
          for idx,b in enumerate(bks):
           q=cls(S.methods_by_name["BackupGetSyncIssues"].input_type)()
           q.value=b.backup.sourcePath
           issues,ms=benchmark("BackupGetSyncIssues",q)
           issues=[i for r in issues for i in r.issues if not i.resolved]
           print("BACKUP",json.dumps({"slot":idx+1,"sourceHash":sha(b.backup.sourcePath),"enabled":b.backup.isEnabled,"status":enum(b,"status"),"open":b.openSyncIssues,"issuesReturned":len(issues),"issuesByType":safe_counts(enum(i,"kind") for i in issues),"issueLatencyMs":ms,"errorsByClass":safe_counts(classify(e.message) for e in b.errors),"errorsCount":len(b.errors),"pendingSource":next((z.pendingChanges for z in b.replicaStatuses if z.isSource),0)},ensure_ascii=False))
          for method in ("GetUploadFileList","GetDownloadFileList"):
           if method not in S.methods_by_name:continue
           try:
            req=cls(S.methods_by_name[method].input_type)()
            for k,val in (("getAll",False),("itemsPerPage",100),("pageNumber",1)):
             if k in req.DESCRIPTOR.fields_by_name:setattr(req,k,val)
            ans,ms=benchmark(method,req)
            for z in ans:
             print("TRANSFER_META",method,json.dumps({"latencyMs":ms,"root":brief(z)},ensure_ascii=False))
             entries=[]
             for f,v in z.ListFields():
              if f.is_repeated and f.type==f.TYPE_MESSAGE and any(x in f.name.lower() for x in ("file","task")):entries.extend(v)
             print("TRANSFER_SAMPLE",method,json.dumps({"returned":len(entries),"statuses":safe_counts(
               next((enum(e,k) for k in ("statusEnum","status","state") if k in e.DESCRIPTOR.fields_by_name and e.DESCRIPTOR.fields_by_name[k].type==14),"UNKNOWN") for e in entries),"classes":safe_counts(classify(
                " ".join(str(getattr(e,k)) for k in e.DESCRIPTOR.fields_by_name if any(t in k.lower() for t in ("error","message","reason"))) ) for e in entries),
                "entryFields":sorted(set(k for e in entries[:3] for k in e.DESCRIPTOR.fields_by_name if any(v in k.lower() for v in ("status","speed","error","progress","size","time","bytes","state"))))},ensure_ascii=False))
           except Exception as e:print("TRANSFER_ERROR",method,type(e).__name__,sha(str(e)))
          print("WAIT_FOR_TRANSFER_PROGRESS")
          time.sleep(20)
          for meth in ("GetUploadFileList","GetDownloadFileList","GetAllTasksCount"):
           try:
            if meth=="GetUploadFileList":
             rq=cls(S.methods_by_name[meth].input_type)()
             rq.getAll=False
             rq.itemsPerPage=100
             rq.pageNumber=1
             result=rpc(meth,rq)
             for k in result:print("FOLLOWUP_UPLOAD",json.dumps({"total":k.totalCount,"globalBytesPerSecond":k.globalBytesPerSecond,"totalBytes":k.totalBytes,"finishedBytes":k.finishedBytes,
              "sampleStatuses":dict(collections.Counter(enum(v,"statusEnum") if "statusEnum" in v.DESCRIPTOR.fields_by_name else "OTHER" for v in k.uploadFiles))},ensure_ascii=False),flush=True)
            elif meth=="GetDownloadFileList":
             result=rpc(meth)
             for k in result:print("FOLLOWUP_DOWNLOAD",json.dumps({"total":len(k.downloadFiles),"globalBytesPerSecond":k.globalBytesPerSecond,
              "nonzeroTaskSpeeds":sum(1 for v in k.downloadFiles if v.bytesPerSecond>0),
              "sampleTaskSpeeds":sorted([round(v.bytesPerSecond,1) for v in k.downloadFiles],reverse=True)[:8]},ensure_ascii=False),flush=True)
            else:
             result=rpc(meth)
             for k in result:print("FOLLOWUP_TASK_COUNTS",json.dumps({"up":k.uploadCount,"down":k.downloadCount}),flush=True)
           except Exception as e:print("FOLLOWUP_ERROR",meth,type(e).__name__,sha(str(e)),flush=True)
          print("DIAGNOSTIC_END")

          
          PY
          PYTHONPATH=/tmp/cd-audit-20261014 python3 -u /tmp/cd-audit-20261014/audit.py
