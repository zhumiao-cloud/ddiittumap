name: SXY ARC restart verification status
on:
  push:
    paths:
      - '.github/workflows/sxy-arc-restart-verify-20261013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read only check of restarted download and service
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "NOW=$(date -Is)"
          UNIT=sxy-mmul10-multiome-local-two-v3-20261013.service
          D=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK2
          systemctl --user show "$UNIT" -p ActiveState -p MainPID -p SubState -p Result -p ExecMainStatus
          journalctl --user -u "$UNIT" -n 18 --no-pager --output=cat | cut -c1-180
          echo '=== GEX_STAGED_FILES ==='
          find "$D/input/GEX" -maxdepth 1 -type f -printf '%f BYTES=%s MTIME=%TH:%TM:%TS\n' | sort
          echo '=== RCLONE_PS ==='
          ps -u h3039 -o pid=,etimes=,state=,comm=,args= | grep -E '[r]clone (copy|lsf)' | cut -c1-290 | head -15 || true
          for p in $(pgrep -u h3039 -x rclone || true); do
             if tr '\0' ' ' < "/proc/$p/cmdline" | grep -Fq '/P10MK2'; then
               echo "PROCESS=$p"
               grep -E 'write_bytes:|wchar:' "/proc/$p/io" || true
             fi
          done
          df -h "$D"
          echo 'RESTART_READONLY_VERIFIED'
          REMOTE
          unset SSHPASS SXY_PSWD