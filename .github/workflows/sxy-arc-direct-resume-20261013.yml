name: Temporary ARC physical download read-only verification
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/sxy-arc-direct-resume-20261013.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temporary-sxy-arc-direct-resume-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify actual allocated bytes, process and ARC service state
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 11
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 -o ServerAliveInterval=20 -o ServerAliveCountMax=8 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          UNIT=sxy-mmul10-multiome-local-two-v3-20261013.service
          GEX=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK2/input/GEX
          ROOT=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          echo "VERIFY_STARTED=$(date -Is)"
          systemctl --user show "$UNIT" -p LoadState -p ActiveState -p SubState -p MainPID -p Result
          echo 'FILES_BEFORE:'
          find "$GEX" -maxdepth 1 -type f -printf '%f|logical=%s|blocks512=%b\n' 2>/dev/null | sort
          echo "GEX_ALLOCATED_BEFORE=$(du -sB1 "$GEX" | awk '{print $1}')"
          echo "ROOT_FREE_BEFORE=$(df -B1 --output=avail "$ROOT" | tail -1 | tr -d ' ')"
          echo 'SAFE_ARC_MARKERS:'
          journalctl --user -u "$UNIT" --since '6 minutes ago' -o cat --no-pager 2>/dev/null |
            grep -E 'LOCAL_ONLY_START=|SAMPLE_BEGIN=|PREFLIGHT=|STAGE_READ_ONLY_SOURCE=|AFTER_STAGE_FREE_BYTES=|ARC_COUNT_BEGIN=|CAPACITY_GUARD_STOP=' |
            tail -n 20 || true
          echo 'PROCESS_COUNTS:'
          ps -u h3039 -o comm= 2>/dev/null | awk '/rclone|cellranger|martian|gzip/{a[$1]++}END{for(k in a) print k,a[k]}'
          sleep 45
          echo 'FILES_AFTER:'
          find "$GEX" -maxdepth 1 -type f -printf '%f|logical=%s|blocks512=%b\n' 2>/dev/null | sort
          echo "GEX_ALLOCATED_AFTER=$(du -sB1 "$GEX" | awk '{print $1}')"
          echo "ROOT_FREE_AFTER=$(df -B1 --output=avail "$ROOT" | tail -1 | tr -d ' ')"
          systemctl --user show "$UNIT" -p LoadState -p ActiveState -p SubState -p MainPID -p Result
          echo "VERIFY_FINISHED=$(date -Is)"
          REMOTE
          unset SSHPASS SXY_PSWD
