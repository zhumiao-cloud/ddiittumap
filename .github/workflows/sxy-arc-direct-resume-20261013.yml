name: Temporary ARC final local filesystem check
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/sxy-arc-direct-resume-20261013.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temporary-sxy-arc-direct-resume-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Confirm local storage and continuing direct download without printing secrets
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 11
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          UNIT=sxy-mmul10-multiome-local-two-v3-20261013.service
          ROOT=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          GEX="$ROOT/P10MK2/input/GEX"
          echo "FINAL_VERIFY_TIME=$(date -Is)"
          echo "ROOT_FSTYPE=$(findmnt -n -T "$ROOT" -o FSTYPE)"
          echo "GEX_FSTYPE=$(findmnt -n -T "$GEX" -o FSTYPE)"
          echo "ROOT_DEVICE=$(stat -c %d "$ROOT")"
          echo "GEX_DEVICE=$(stat -c %d "$GEX")"
          echo "ROOT_FREE=$(df -B1 --output=avail "$ROOT" | tail -1 | tr -d ' ')"
          echo "GEX_FREE=$(df -B1 --output=avail "$GEX" | tail -1 | tr -d ' ')"
          echo "GEX_ALLOCATED=$(du -sB1 "$GEX" | awk '{print $1}')"
          echo 'R1_R2_BEFORE:'
          for name in 2-GEX_S1_L001_R1_001.fastq.gz 2-GEX_S1_L001_R2_001.fastq.gz; do
            if test -e "$GEX/$name"; then stat -c '%n|size=%s|blocks512=%b' "$GEX/$name" | sed "s#$GEX/##"; fi
          done
          echo "UNIT_STATE_BEFORE=$(systemctl --user show "$UNIT" -p ActiveState --value)"
          sleep 20
          echo 'R1_R2_AFTER:'
          for name in 2-GEX_S1_L001_R1_001.fastq.gz 2-GEX_S1_L001_R2_001.fastq.gz; do
            if test -e "$GEX/$name"; then stat -c '%n|size=%s|blocks512=%b' "$GEX/$name" | sed "s#$GEX/##"; fi
          done
          echo "UNIT_STATE_AFTER=$(systemctl --user show "$UNIT" -p ActiveState --value)"
          echo "FINISHED=$(date -Is)"
          REMOTE
          unset SSHPASS SXY_PSWD
