name: Temporary ARC unit registration diagnostic
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/sxy-arc-direct-resume-20261013.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'temporary-sxy-arc-direct-resume-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only diagnosis of ARC unit registration and repaired script
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 11
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          UNIT=sxy-mmul10-multiome-local-two-v3-20261013.service
          BASE=/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner
          WORK=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          echo "REMOTE_DATE=$(date -Is)"
          echo 'SERVICE_PROPERTIES_START'
          systemctl --user show "$UNIT" -p LoadState -p ActiveState -p SubState -p UnitFileState -p FragmentPath -p Result || true
          echo SERVICE_PROPERTIES_END
          echo 'UNIT_FILES_MATCH:'
          find "$HOME/.config/systemd/user" /etc/systemd/user -maxdepth 2 -iname '*multiome*' -printf '%f %y\n' 2>/dev/null || :
          echo 'SCRIPT_CANDIDATES:'
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner')
          for f in b.glob('*.sh'):
              if f.is_symlink() or not f.is_file(): continue
              s=f.read_text(errors='replace')
              if 'P10MK2 P20MK3' in s or 'NO_WEBDAV_WRITES_NO_AUTO_CLEANUP=YES' in s:
                  print(f.name,'proxy_unset=', 'unset HTTPS_PROXY https_proxy HTTP_PROXY http_proxy ALL_PROXY all_proxy' in s, 'marker=', 'NO_WEBDAV_WRITES_NO_AUTO_CLEANUP=YES' in s,'mode=', oct(f.stat().st_mode&0o777))
          PY
          echo 'PROCESS_CHECK:'
          ps -u h3039 -o comm= 2>/dev/null | awk '/cellranger-arc|rclone|martian/{a[$1]++}END{for(k in a) print k,a[k]}'
          echo "FREE_BYTES=$(df -B1 --output=avail "$WORK" | tail -1 | tr -d ' ')"
          echo AUDIT_FINISHED
          REMOTE
          unset SSHPASS SXY_PSWD
