name: SXY reclaim finished macaque FASTQ copies for multiome
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-macaque-local-stage-reclaim-20261013.yml']
permissions:
  contents: read
jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Safely pause macaque and remove only verified redundant FASTQ copies
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || exit 10
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get -qq update
          sudo apt-get -qq -y install sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '===== FREE_BEFORE ====='
          df -B1 --output=avail /home/h3039 | tail -n 1
          echo '===== PAUSE_MACAQUE_TO_PROTECT_MULTIOME_DISK ====='
          systemctl --user stop sxy-macaque-lung-resumable.service
          if test "$(systemctl --user show sxy-macaque-lung-resumable.service -p ActiveState --value)" != inactive; then
            echo MACAQUE_SERVICE_STOP_FAILED
            exit 41
          fi
          echo MACAQUE_PAUSED=YES
          echo '===== VERIFIED_FINISHED_SAMPLE_FASTQ_RECLAIM ====='
          python3 - <<'PY'
          from pathlib import Path
          import os,shutil
          h=Path.home()
          source=h/'PROJECTS/zhumiao/danxibao2/刘光慧食蟹猴肺'
          work=h/'PROJECTS/zhumiao/.sxy_macaca_lung_work'
          finalroot=h/'PROJECTS/zhumiao/danxibao2/数据清理整理/刘光慧食蟹猴肺'
          ids=[('Lung_YM2',928),('Lung_YM3',932),('Lung_YM4',936),('Lung_YF1',940)]
          names=('matrix.mtx.gz','features.tsv.gz','barcodes.tsv.gz')
          reclaimed=0
          for s,start in ids:
              stage=work/'local_fastqs'/s
              count=work/'counts'/s/'outs'
              final=finalroot/s
              try:
                  ready=all((count/'filtered_feature_bc_matrix'/n).is_file() and (count/'filtered_feature_bc_matrix'/n).stat().st_size>0 for n in names)
                  delivered=all((final/'10x'/n).is_file() and (final/'10x'/n).stat().st_size>0 for n in names)
                  if not (ready and delivered):
                      print(f'SKIP_{s}=MATRIX_NOT_PRESERVED',flush=True)
                      continue
                  matches=[]
                  for lane,number in enumerate(range(start,start+4),1):
                      run=f'CRR{130000+number}'
                      for name,tag in (('R1','f1'),('R2','r2')):
                          local=stage/f'{s}_S1_L{lane:03d}_{name}_001.fastq.gz'
                          original=source/run/f'{run}_{tag}.fq.gz'
                          if not local.is_file() or local.is_symlink() or local.stat().st_size<100:
                              raise RuntimeError('LOCAL_FASTQ_NOT_FULL')
                          if not original.is_file() or original.stat().st_size!=local.stat().st_size:
                              raise RuntimeError('ORIGINAL_REMOTE_SIZE_MISMATCH')
                          matches.append(local)
                  if len(matches)!=8:
                      raise RuntimeError('NOT_8_FILES')
                  bytes_to_free=sum(x.stat().st_size for x in matches)
                  for x in matches:
                      x.unlink()
                  reclaimed+=bytes_to_free
                  print(f'CLEANED {s} COPIES=8 BYTES={bytes_to_free}',flush=True)
              except Exception as e:
                  print(f'SKIP {s} REASON={type(e).__name__}',flush=True)
          os.sync()
          print(f'TOTAL_RECLAIMED_BYTES={reclaimed}',flush=True)
          print('NOTE=NO_ORIGINAL_OR_CELLRANGER_OR_MULTIOME_FILES_REMOVED',flush=True)
          PY
          echo '===== FREE_AFTER ====='
          df -B1 --output=avail /home/h3039 | tail -n 1
          echo RECLAIM_WORKFLOW_DONE
          REMOTE
          unset SSHPASS SXY_PSWD
