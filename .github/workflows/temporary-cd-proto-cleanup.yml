name: One-shot cleanup of temporary CloudDrive protocol checks
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-proto-cleanup.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete protocol-only runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          for id in 38505655368 38505814526; do
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
              echo "REMOVED ${id}"
            else
              echo "UNABLE_TO_REMOVE ${id}"
            fi
          done
