name: SXY Multiome local-only safety switch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-multiome-local-only-switch-20261013.yml']
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Stop outgoing WebDAV workflow and preserve all ARC files
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 14
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          test "$(id -un)" = h3039
          echo SWITCH_TIME=$(date -Is)
          for unit in sxy-mmul10-multiome-recovery-v5-20261013.service sxy-mmul10-multiome-recovery-v4-20261013.service sxy-mmul10-multiome-recovery-v3-20261013.service sxy-mmul10-multiome-recovery-v2-20261013.service sxy-mmul10-multiome-recovery-20261013.service sxy-mmul10-multiome-arc-20261010.service; do
            state=$(systemctl --user show "$unit" -p ActiveState --value 2>/dev/null || true)
            echo "BEFORE $unit $state"
            if [ "$state" = active ] || [ "$state" = activating ]; then
              systemctl --user stop "$unit"
            fi
            echo "AFTER $unit $(systemctl --user show "$unit" -p ActiveState --value 2>/dev/null || true)"
          done
          echo "=== WORKER_PROCESSES ==="
          ps -u h3039 -o pid,ppid,etime,args | grep -E '[c]ellranger-arc count|[a]rc_validate_seurat.R|[r]clone (copy|copyto|check)|[m]ultiome_recovery' | cut -c1-245 || true
          echo "=== LOCAL_ONLY_SAMPLE_STATUS ==="
          WORK=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          for sample in P10MK1_1 P10MK2 P20MK3; do
            D="$WORK/$sample"
            echo SAMPLE="$sample"
            if [ -d "$D" ]; then
              du -sh "$D" || true
              OUT="$D/pipeline/$sample/outs"
              for rel in filtered_feature_bc_matrix/matrix.mtx.gz filtered_feature_bc_matrix/features.tsv.gz filtered_feature_bc_matrix/barcodes.tsv.gz raw_feature_bc_matrix/matrix.mtx.gz filtered_feature_bc_matrix.h5 raw_feature_bc_matrix.h5 gex_possorted_bam.bam atac_possorted_bam.bam atac_fragments.tsv.gz; do
                if [ -s "$OUT/$rel" ]; then stat -c 'PRESENT %s %n' "$OUT/$rel"; else echo "MISSING $rel"; fi
              done
              for rel in "$D/${sample}_seurat_multiome.rds" "$D/.postarc_rds_validated" "$D/.fully_verified" "$D/arc_validate_seurat.log"; do
                [ ! -e "$rel" ] || stat -c 'LOCAL %s %n' "$rel"
              done
              if [ -f "$D/arc_validate_seurat.log" ]; then tail -n 8 "$D/arc_validate_seurat.log" | cut -c1-220; fi
            else echo LOCAL_STAGE_ABSENT; fi
          done
          df -h "$WORK"
          echo LOCAL_ONLY_SAFETY_SWITCH_COMPLETED
          REMOTE
          unset SSHPASS SXY_PSWD
