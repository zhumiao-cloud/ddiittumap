name: SXY ARC safe local-only GEX restart
on:
  push:
    paths:
      - '.github/workflows/sxy-arc-gex-restart-20261013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Confirm cleared partial input and restart sequential ARC worker locally
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          umask 077
          test "$(id -un)" = h3039
          WORK=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          SCRIPT=/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/arc_multiome_remaining_local_only_20261013.sh
          OLD=sxy-mmul10-multiome-local-two-v2-20261013.service
          NEW=sxy-mmul10-multiome-local-two-v3-20261013.service
          test -s "$SCRIPT" && test ! -L "$SCRIPT"
          bash -n "$SCRIPT"
          test "$(systemctl --user show "$OLD" -p ActiveState --value)" != active
          test "$(systemctl --user show "$NEW" -p ActiveState --value)" != active
          test -d "$WORK/P10MK2/input/GEX"
          test "$(find "$WORK/P10MK2/input/GEX" -maxdepth 1 -type f | wc -l)" = 0
          test ! -s "$WORK/P10MK2/pipeline/P10MK2/outs/gex_possorted_bam.bam"
          test -s "$WORK/P10MK1_1/pipeline/P10MK1_1/outs/gex_possorted_bam.bam"
          test -s "$WORK/P10MK1_1/pipeline/P10MK1_1/outs/atac_possorted_bam.bam"
          test -s "$WORK/P10MK1_1/P10MK1_1_seurat_multiome.rds"
          C=/home/h3039/.cache/rclone-danxibao3-active
          test -d "$C" && test ! -L "$C"
          n=$(find "$C" -type f | wc -l)
          test "$n" -eq 0
          echo 'DANXIBAO3_WEBDAV_VFS_FILE_CACHE_EMPTY_VERIFIED=YES'
          if ps -u h3039 -o args= | grep -F 'rclone copy danxibao3_webdav:P10MK2/GEX' | grep -v grep >/dev/null; then
            echo 'CONCURRENT_COPY_FOUND_STOP'; exit 48
          fi
          echo "RESTART_TIME=$(date -Is)"
          echo 'START_NEW_LOCAL_ONLY_SEQUENTIAL_P10MK2_P20MK3_WORKER'
          systemd-run --user --unit=sxy-mmul10-multiome-local-two-v3-20261013 \
            --description="Local-only ARC 2.2.0 P10MK2 P20MK3 restarted after partial FASTQ cleanup" \
            /usr/bin/flock -n "$WORK/.multiome_arc_local_two.lock" \
            /usr/bin/bash "$SCRIPT"
          sleep 6
          systemctl --user show "$NEW" -p ActiveState -p SubState -p MainPID -p Result -p ExecMainStatus
          journalctl --user -u "$NEW" -n 12 --no-pager --output=cat | cut -c1-220
          echo '=== RESUMED_GEX_FILES ==='
          find "$WORK/P10MK2/input/GEX" -maxdepth 1 -type f -printf 'FILE=%f BYTES=%s\n' | sort
          echo '=== DISK ==='
          df -h "$WORK"
          echo 'LOCAL_ONLY_RESTART_AUDIT_FINISHED'
          REMOTE
          unset SSHPASS SXY_PSWD