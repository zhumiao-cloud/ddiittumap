name: Temporary CloudDrive official API schema inspection
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-official-proto.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'zhumiao-cloud/ddiittumap'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect official CloudDrive backup protection RPC declarations
        shell: bash
        run: |
          set -euo pipefail
          set +x
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/clouddrive.proto
          echo '===== ISSUE AND RESOLUTION STRUCTS ====='
          sed -n '2550,2571p;2619,2685p' /tmp/clouddrive.proto
          echo '===== BACKUP RPC ====='
          sed -n '511,545p' /tmp/clouddrive.proto
