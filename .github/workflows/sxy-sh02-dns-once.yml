name: SXY sh02 DNS once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-sh02-dns-once.yml']
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve sh02 only
        shell: bash
        run: |
          set -euo pipefail
          echo SH02_IPV4
          getent ahostsv4 sh02-httpdown.guangyacdn.com | awk '{print $1}' | sort -u
