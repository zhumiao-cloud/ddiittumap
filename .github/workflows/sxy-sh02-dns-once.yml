name: SXY sh02 DNS once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-sh02-dns-once.yml']
permissions:
  contents: read
jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve sh02 via public DNS-over-HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          name="sh02-httpdown.guangyacdn.com"
          for label,url,headers in [
              ("GOOGLE",f"https://dns.google/resolve?name={name}&type=A",{}),
              ("CLOUDFLARE",f"https://cloudflare-dns.com/dns-query?name={name}&type=A",{"accept":"application/dns-json"}),
          ]:
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      d=json.load(r)
                  ips=sorted({a["data"] for a in d.get("Answer",[]) if a.get("type")==1})
                  print(label+"_A="+",".join(ips))
                  print(label+"_STATUS="+str(d.get("Status")))
              except Exception as e:
                  print(label+"_ERROR="+type(e).__name__)
          PY
