name: Temporary SFTP owner-marker conflict diagnostic
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-sftp-owner-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Classify SFTP linked backups via official proto
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/sftp-owner-once' EXIT
          mkdir -p /tmp/sftp-owner-once
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/sftp-owner-once/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/sftp-owner-once --python_out=/tmp/sftp-owner-once /tmp/sftp-owner-once/clouddrive.proto
          cat >/tmp/sftp-owner-once/diag.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          clouds=rpc("GetAllCloudApis")
          apis=[a for x in clouds for a in x.apis]
          sftps=[a.path for a in apis if ("sftp"==a.name.strip().lower() or "sftp"==a.path.rstrip("/").split("/")[-1].lower())]
          print("STORAGE_COUNTS",len(apis),"sftp_matches",len(sftps))
          if len(sftps)!=1:raise RuntimeError("SFTP is not uniquely identifiable")
          sftp=sftps[0]; print("SFTP_ROOT_HASH",digest(sftp))
          backs=rpc("BackupGetAll")[0].backups
          print("BACKUP_COUNT",len(backs))
          linked=[]
          for i,b in enumerate(backs,1):
           v=b.backup
           paths=[v.sourcePath]+[d.destinationPath for d in v.destinations]
           intersects=[under(p,sftp) or under(sftp,p) for p in paths]
           is_sftp=any(intersects)
           if is_sftp:linked.append(i)
           print("BACKUP",json.dumps({"id":i,"src_hash":digest(v.sourcePath),"mode":name(v,"syncMode"),"enabled":v.isEnabled,"ownerMarker":v.syncOwnerMarker,"state":name(b,"status"),"issueCount":b.openSyncIssues,"errorCount":len(b.errors),"sftpLinked":is_sftp,"sftpEndCount":sum(intersects),"heldGuards":b.heldDeletionGuards,"statusClass":cat(b.statusMessage),"recentErrors":dict(collections.Counter(cat(e.message) for e in b.errors))},ensure_ascii=False))
          for i in linked:
           b=backs[i-1];v=b.backup;paths=[v.sourcePath]+[d.destinationPath for d in v.destinations]
           for j,c in enumerate(backs,1):
            if i==j:continue
            other=[c.backup.sourcePath]+[d.destinationPath for d in c.backup.destinations]
            overlaps=any(related(p,q) for p in paths for q in other)
            if overlaps:print("OVERLAP",i,j,"otherMode",name(c.backup,"syncMode"),"otherEnabled",c.backup.isEnabled)
           req=cls(S.methods_by_name["BackupGetStatus"].input_type)()
           req.value=v.sourcePath
           x=rpc("BackupGetStatus",req)
           if x:
            status=x[0]
            print("DETAIL",json.dumps({"id":i,"state":name(status,"status"),"statusClass":cat(status.statusMessage),"watcher":name(status,"watcherStatus"),"replicas":[{"source":x.isSource,"state":name(x,"state"),"indexReady":x.indexReady,"openIssues":x.openIssues,"pathHash":digest(x.path)} for x in status.replicaStatuses],"errorClasses":dict(collections.Counter(cat(e.message) for e in status.errors))},ensure_ascii=False))
           rq=cls(S.methods_by_name["BackupGetSyncIssues"].input_type)();rq.value=v.sourcePath
           issues=[z for y in rpc("BackupGetSyncIssues",rq) for z in y.issues]
           print("ISSUES",json.dumps({"id":i,"returned":len(issues),"kindCounts":dict(collections.Counter(name(x,"kind") for x in issues)),"ownerLike":[{"id":x.id,"kind":name(x,"kind"),"detailClass":cat(x.detail),"replicaHash":digest(x.replica)} for x in issues if (cat(x.detail)=="OWNER_CONFLICT" or re.search("owner|instance",name(x,"kind"),re.I))][:40]},ensure_ascii=False))
          print("SFTP_LINKED_BACKUP_IDS",json.dumps(linked))
          print("RELEVANT_METHODS",json.dumps([m.name for m in S.methods if ("Backup" in m.name and ("Restart" in m.name or "Update" in m.name or "Status" in m.name)) or "Owner" in m.name]))
          PY
          PYTHONPATH=/tmp/sftp-owner-once python3 -u /tmp/sftp-owner-once/diag.py
