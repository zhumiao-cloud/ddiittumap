name: SXY Multiome local status audit 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-multiome-status-once-20261013.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read-only ARC service progress and disk
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          mkdir -p -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          W=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          echo "DATE=$(date -Is)"
          systemctl --user show sxy-mmul10-multiome-local-two-v2-20261013.service -p ActiveState -p MainPID -p Result -p ExecMainStatus
          df -h "$W"
          for s in P10MK1_1 P10MK2 P20MK3; do
             echo "SAMPLE=$s"
             for p in "$W/$s/input" "$W/$s/pipeline/$s/outs" "$W/$s/${s}_seurat_multiome.rds" "$W/$s/.local_arc_verified"; do
                if test -d "$p"; then du -sh "$p"; elif test -s "$p"; then stat -c 'FILE_BYTES=%s NAME=%n' "$p"; else echo ABSENT; fi
             done
          done
          journalctl --user -u sxy-mmul10-multiome-local-two-v2-20261013.service -n 14 --no-pager --output=cat | cut -c1-220
          echo STATUS_CHECK_FINISHED
          REMOTE
          unset SSHPASS SXY_PSWD
