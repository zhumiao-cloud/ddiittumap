name: Read-only current Multiome status
on:
  workflow_dispatch:
permissions: {}
jobs:
  status:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.triggering_actor == 'zhumiao-cloud' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Encrypted read-only status
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        shell: bash
        run: |
