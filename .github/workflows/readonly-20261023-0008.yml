          printf '%s\n' "$SXY_PSWD"
          ASK
          chmod 700 "$d/askpass"
          export SSH_ASKPASS="$d/askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          set +e
          timeout 90 setsid ssh -T -p 20111 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$d/known_hosts" -o ConnectTimeout=20 -o NumberOfPasswordPrompts=1 h3039@sxycloud1.top 'bash -s' > "$d/report" 2>&1 <<'REMOTE'
          set -u
          date -Is
          printf '\n=== PROCESS ===\n'
          ps -u h3039 -o pid,ppid,etime,time,%cpu,%mem,stat,args | grep -E 'multiome_mk_heart|PID' | grep -v grep || true
          cd /home/h3039/PROJECTS/zhumiao/multiome_output || exit
          printf '\n=== RECENT FILE METADATA ===\n'
          find . -maxdepth 2 -type f -printf '%T@ %TY-%Tm-%Td %TH:%TM:%TS %s %p\n' | sort -nr | head -45
          printf '\n=== LATEST LOGS ===\n'
          find . -maxdepth 1 -type f -name 'multiome_mk_heart*.log' -printf '%T@ %p\n' | sort -nr | head -2 | cut -d' ' -f2- | while IFS= read -r f; do
          printf '\n--- %s ---\n' "$f"
          tail -180 -- "$f"
          printf '\n--- MARKERS ---\n'
          grep -Ein 'error|execution halted|finished|complete|saved|done|warning|开始|完成|错误' "$f" | tail -30 || true
          done
          REMOTE
          rc=$?
          set -e
          printf '\nSSH_EXIT=%s\n' "$rc" >> "$d/report"
          openssl cms -encrypt -binary -aes-256-cbc -in "$d/report" -outform DER -out "$d/report.enc" "$d/cert.pem"
          echo ENCRYPTED_BEGIN
          base64 -w 100 "$d/report.enc"
          echo ENCRYPTED_END
          test "$rc" -eq 0
