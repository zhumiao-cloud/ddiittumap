name: SXY P10 ATAC rebuild status
on:
  push:
    paths:
      - '.github/workflows/sxy-p10-atac-rebuild-status.yml'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read rebuild state only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          unit=sxy-p10-atac-rebuild-20261012.service
          echo "NOW=$(date -Is)"
          systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p NRestarts -p MainPID --no-pager 2>/dev/null || true
          echo JOURNAL
          journalctl --user -u "$unit" --no-pager --output=cat -n 60 2>/dev/null | tail -n 60 || true
          echo CHUNKS
          find "$HOME/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1/.atac_rebuild" -type f -name 'chunk.*' -printf '%s\n' 2>/dev/null | awk '{n++;s+=$1} END{printf "count=%d bytes=%d gib=%.3f\n",n+0,s+0,s/1073741824}'
          echo PROCESSES
          ps -u h3039 -o pid,etime,%cpu,%mem,comm,args --sort=-%cpu | grep -E '[r]clone cat danxibao3_webdav:P10MK1_1/ATAC|[s]xy_p10_atac_verified_rebuild|[m]d5sum|[g]zip -t' | head -n 40 || true
          df -hT "$HOME" | tail -n 1
          REMOTE
          unset SSHPASS SXY_PSWD
