name: SXY remaining root manifests
on:
  push:
    paths:
      - '.github/workflows/sxy-p10-atac-rebuild-status.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read sample-root manifest files
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          root="$HOME/PROJECTS/zhumiao/danxibao3"
          for s in P10MK2 P20MK3; do
            echo "SAMPLE=$s"
            timeout 40 find "$root/$s" -maxdepth 2 -type f \( -iname '*md5*' -o -iname '*checksum*' -o -iname 'readme*' \) -printf '%P\n' 2>/dev/null | head -n 50 || true
            for f in "$root/$s"/md5.md5 "$root/$s"/README*; do
              [ -f "$f" ] || continue
              echo "FILE=$(basename "$f")"
              grep -E '^[0-9a-fA-F]{32}[[:space:]]+|fastq|FASTQ|size|MD5' "$f" 2>/dev/null | head -n 100 || true
            done
          done
          REMOTE
          unset SSHPASS SXY_PSWD
