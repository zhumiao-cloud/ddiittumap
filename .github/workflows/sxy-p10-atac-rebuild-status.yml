name: SXY remaining manifests
on:
  push:
    paths:
      - '.github/workflows/sxy-p10-atac-rebuild-status.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read mounted checksum manifests
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          root="$HOME/PROJECTS/zhumiao/danxibao3"
          for s in P10MK2 P20MK3; do
            for lib in GEX ATAC; do
              echo "SECTION=$s/$lib"
              find "$root/$s/$lib" -maxdepth 1 -type f \( -iname '*md5*' -o -iname 'readme*' \) -printf '%f\n' 2>/dev/null | head -n 20 || true
              if [ -f "$root/$s/$lib/md5.md5" ]; then
                grep -E '^[0-9a-fA-F]{32}[[:space:]]+' "$root/$s/$lib/md5.md5" | head -n 100 || true
              fi
            done
          done
          REMOTE
          unset SSHPASS SXY_PSWD
