name: SXY Multiome local capacity preflight 20261013
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-multiome-local-preflight-20261013.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read-only samples source size and current local scratch
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 14
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          W=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          R=/home/h3039/PROJECTS/zhumiao/danxibao3
          echo "NOW=$(date -Is)"
          df -B1 --output=source,size,used,avail,pcent,target "$W" | tail -n 1
          for p in "$W/P10MK1_1" "$W/P10MK1_1/input" "$W/P10MK1_1/pipeline" "$W/P10MK1_1/pipeline/P10MK1_1/outs"; do
            if test -d "$p"; then du -sB1 "$p"; fi
          done
          for sample in P10MK2 P20MK3; do
            echo "SAMPLE=$sample"
            test -d "$R/$sample"
            for modality in GEX ATAC; do
              echo "SOURCE_SIZE=$sample/$modality"
              timeout 90 rclone lsf "danxibao3_webdav:$sample/$modality" --files-only --recursive --format sp --separator '|' | awk -F '|' '{ n++; if($2 ~ /^[0-9]+$/) bytes+=$2; if(n<=3) print "FILE_NAME=" $1 " BYTES=" $2 } END{printf "FILE_COUNT=%d BYTES=%.0f\n",n,bytes}'
            done
          done
          echo "SOFTWARE"
          /home/h3039/software/cellranger-arc-2.2.0/cellranger-arc --version
          echo "NO_WRITES_PREFLIGHT_FINISHED"
          REMOTE
          unset SSHPASS SXY_PSWD
