name: P10MK1 verified redundant staged FASTQ cleanup
on:
  push:
    paths:
      - .github/workflows/p10mk1-clean-fastqs-20261013.yml
permissions:
  contents: read
jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify archived ARC outputs and original source then reclaim exactly 18 local staged FASTQs
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}" || exit 11
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          umask 077
          test "$(id -un)" = h3039
          python3 - <<'PY'
          import json,os,re,subprocess,csv
          from pathlib import Path
          base=Path('/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1')
          outs=base/'pipeline'/'P10MK1_1'/'outs'
          def guard(c,msg):
              if not c: raise RuntimeError('SAFE_CLEANUP_STOP: '+msg)
          guard(base.is_dir() and not base.is_symlink() and base.stat().st_uid==os.getuid(),'unexpected target')
          required=('filtered_feature_bc_matrix/matrix.mtx.gz','filtered_feature_bc_matrix/features.tsv.gz','filtered_feature_bc_matrix/barcodes.tsv.gz','raw_feature_bc_matrix/matrix.mtx.gz','raw_feature_bc_matrix/features.tsv.gz','raw_feature_bc_matrix/barcodes.tsv.gz','filtered_feature_bc_matrix.h5','raw_feature_bc_matrix.h5','gex_possorted_bam.bam','gex_possorted_bam.bam.bai','atac_possorted_bam.bam','atac_possorted_bam.bam.bai','atac_fragments.tsv.gz','atac_fragments.tsv.gz.tbi','gex_molecule_info.h5','summary.csv','web_summary.html')
          guard(all((outs/f).is_file() and (outs/f).stat().st_size>0 for f in required),'ARC official output incomplete')
          rds=base/'P10MK1_1_seurat_multiome.rds'
          guard(rds.is_file() and rds.stat().st_size>100000000,'validated RDS missing')
          guard((base/'.postarc_rds_validated').is_file(),'RDS checkpoint missing')
          guard('PASS sample=P10MK1_1' in (base/'arc_validate_seurat.log').read_text(),'RDS validation not passed')
          guard('Pipestance completed successfully!' in (base/'cellranger_arc_console.log').read_text(),'ARC count not completed')
          cmd=subprocess.run(['ps','-u','h3039','-o','args='],capture_output=True,text=True,check=True).stdout
          guard(not any('cellranger-arc count' in l and 'P10MK1_1' in l for l in cmd.splitlines()),'count still processing same sample')
          with (base/'libraries.csv').open() as h: rows=list(csv.DictReader(h))
          guard(len(rows)==2 and {x.get('library_type') for x in rows}=={'Gene Expression','Chromatin Accessibility'},'invalid libraries manifest')
          guard(all(x.get('sample')=='P10-zc' for x in rows),'unexpected sample manifest')
          guard(all(x.get('fastqs')==str(base/'input'/('GEX' if x['library_type']=='Gene Expression' else 'ATAC')) for x in rows),'FASTQ directory does not match manifest')
          collected=[]
          total=0
          for m in ('GEX','ATAC'):
              d=base/'input'/m
              guard(d.is_dir() and not d.is_symlink(),'missing modality input')
              fq={p.name:p for p in d.iterdir() if p.name.endswith('.fastq.gz')}
              expected={f'P10-zc_S1_L001_R{j}_001.fastq.gz' for j in (1,2)} if m=='GEX' else {f'P10-zc_S1_L{lane:03d}_{read}_001.fastq.gz' for lane in range(1,5) for read in ('I1','R1','R2','R3')}
              guard(set(fq)==expected,'local FASTQ names incomplete or unexpected '+m)
              listing=subprocess.run(['timeout','115','rclone','lsjson',f'danxibao3_webdav:P10MK1_1/{m}','--files-only'],capture_output=True,text=True,timeout=120)
              guard(listing.returncode==0,'original source listing unavailable '+m)
              original={x['Name']:x['Size'] for x in json.loads(listing.stdout) if x['Name'].endswith('.fastq.gz')}
              guard(set(original)==expected,'original source FASTQ set differs '+m)
              for name,p in sorted(fq.items()):
                  guard(p.is_file() and not p.is_symlink(),'not regular file '+m)
                  guard(p.stat().st_size==original[name] and original[name]>0,'source vs staged byte count differs '+name)
                  guard(p.parent==d,'unexpected file deletion location')
                  collected.append(p);total+=p.stat().st_size
          guard(len(collected)==18 and total>100000000000,'unexpected number or total size')
          print(f'PRE_DELETE_VALIDATED_FASTQS={len(collected)} VERIFIED_BYTES={total}',flush=True)
          # Only these 18 byte-identical-in-size local staged FASTQs; no source/ARC/BAM/RDS/sidecar touched.
          for p in collected: p.unlink()
          guard(all(not p.exists() for p in collected),'incomplete local FASTQ cleanup')
          guard(all((outs/f).is_file() and (outs/f).stat().st_size>0 for f in required),'outputs changed')
          guard(rds.is_file() and rds.stat().st_size>100000000,'RDS changed')
          print(f'P10MK1_1_LOCAL_FASTQ_RECLAIM_PASS=18 BYTES={total}',flush=True)
          print('WEBDAV_AND_ALL_ARC_OUTS_AND_RDS_PRESERVED=YES',flush=True)
          PY
          df -h /home/h3039/PROJECTS/zhumiao/multiome_arc_work
          systemctl --user show sxy-mmul10-multiome-local-two-v2-20261013.service -p ActiveState -p MainPID -p Result
          echo VERIFIED_STAGED_FASTQ_CLEANUP_FINISHED
          REMOTE
          unset SSHPASS SXY_PSWD
