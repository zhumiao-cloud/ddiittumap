name: Multiome local capacity readout
on:
  push:
    paths:
      - '.github/workflows/sxy-capacity-20261013.yml'
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read filesystem capacity through authorized proxy
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          echo '=== DISK ==='
          df -h /home/h3039 | tail -n 1
          echo '=== LOCAL_CAPACITY ==='
          for p in /home/h3039/PROJECTS/zhumiao/multiome_arc_work /home/h3039/PROJECTS/zhumiao/.sxy_macaca_lung_work /home/h3039/reference /home/h3039/.cache /tmp; do
            printf 'GROUP=%s ' "$(basename "$p")"
            if [ -d "$p" ]; then
              timeout 30 du -sxh "$p" 2>/dev/null | awk '{print "SIZE="$1}' || true
            else
              echo MISSING
            fi
          done
          echo '=== PROJECT_TOTAL ==='
          timeout 70 du -sxh /home/h3039/PROJECTS/zhumiao 2>/dev/null | awk '{print "SIZE="$1}' || true
          echo CAPACITY_READ=PASS
          REMOTE
          unset SSHPASS SXY_PSWD
