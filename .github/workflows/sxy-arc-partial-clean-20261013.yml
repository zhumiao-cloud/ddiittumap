name: SXY ARC paused GEX partial cleanup and cache safety audit
on:
  push:
    paths:
      - '.github/workflows/sxy-arc-partial-clean-20261013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Stop only ARC two-sample worker, delete two confirmed local partial copies
        shell: bash
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          umask 077
          test "$(id -un)" = h3039
          UNIT=sxy-mmul10-multiome-local-two-v2-20261013.service
          BASE=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK2
          GEX="$BASE/input/GEX"
          test -d "$BASE" && test ! -L "$BASE" && test -d "$GEX" && test ! -L "$GEX"
          test "$(stat -c '%U' "$BASE")" = h3039
          test ! -e "$BASE/.local_arc_verified"
          test ! -s "$BASE/pipeline/P10MK2/outs/gex_possorted_bam.bam"
          test "$(systemctl --user show "$UNIT" -p ActiveState --value)" = active
          echo '=== VERIFY_SOURCE_LOCAL_BEFORE_PAUSE ==='
          timeout 75 rclone lsjson danxibao3_webdav:P10MK2/GEX --files-only | python3 -c 'import json,sys;d={x["Name"]:x["Size"] for x in json.load(sys.stdin)}; assert set(d)=={"2-GEX_S1_L001_R1_001.fastq.gz","2-GEX_S1_L001_R2_001.fastq.gz"};assert d["2-GEX_S1_L001_R1_001.fastq.gz"]==44645007148 and d["2-GEX_S1_L001_R2_001.fastq.gz"]==30568390543;print("REMOTE_GEX_METADATA_VERIFIED",flush=True)'
          echo '=== PAUSE_SERVICE ==='
          systemctl --user stop "$UNIT"
          test "$(systemctl --user show "$UNIT" -p ActiveState --value)" != active
          if ps -u h3039 -o args= | grep -F 'rclone copy danxibao3_webdav:P10MK2/GEX' | grep -v grep >/dev/null; then
            echo 'ACTIVE_GEX_WRITER_STOP_NOT_CONFIRMED'; exit 62
          fi
          echo 'ARC_TWO_SAMPLE_WORKER_PAUSED=YES'
          echo '=== DELETE_EXACT_CONFIRMED_PARTIAL_FILES ==='
          python3 - <<'PY'
          from pathlib import Path
          import os,stat
          b=Path('/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK2/input/GEX')
          assert b.is_dir() and not b.is_symlink() and b.stat().st_uid==os.getuid()
          src={'2-GEX_S1_L001_R1_001.fastq.gz':44645007148,'2-GEX_S1_L001_R2_001.fastq.gz':30568390543}
          files={p.name for p in b.iterdir() if p.is_file()}
          assert files==set(src),f"STOP_UNEXPECTED_GEX_FILESET={len(files)}"
          removed=0;total=0
          for name,size in src.items():
            p=b/name; st=p.lstat()
            assert stat.S_ISREG(st.st_mode) and st.st_uid==os.getuid() and st.st_size>0 and st.st_size<size,(name,st.st_size)
          for name in src:
            p=b/name
            sz=p.stat().st_size
            p.unlink()
            removed+=1;total+=sz
            print(f'LOCAL_INCOMPLETE_FASTQ_DELETED={name} LOGICAL_BYTES={sz}',flush=True)
          assert removed==2 and not any((b/n).exists() for n in src)
          print(f'ONLY_GEX_PARTIALS_DELETED=2 TOTAL_LOGICAL_BYTES={total}',flush=True)
          PY
          echo '=== DANXIBAO3_SPECIFIC_WEBDAV_VFS_CACHE_AUDIT ==='
          C=/home/h3039/.cache/rclone-danxibao3-active
          if test -d "$C" && test ! -L "$C"; then
            du -sh "$C" || true
            find "$C" -mindepth 1 -maxdepth 2 -type d | head -25
            find "$C" -type f -printf '%s\n' | awk '{n++;sum+=$1} END{printf "CACHE_FILE_COUNT=%d CACHE_LOGICAL_BYTES=%.0f\n",n,sum}'
            find "$C" -type f -mmin -120 | wc -l | xargs echo CACHE_RECENTLY_MODIFIED_FILE_COUNT=
          else echo 'DANXIBAO3_CACHE_DIRECTORY_ABSENT'; fi
          echo '=== MOUNT_PROCESS_AND_SIZE ==='
          ps -u h3039 -o pid=,comm=,args= | grep '[r]clone mount danxibao3_webdav:' | cut -c1-360 || true
          df -h "$GEX"
          echo 'SAFE_PAUSE_AND_PARTIAL_CLEAN_FINISHED'
          REMOTE
          unset SSHPASS SXY_PSWD