name: SXY macaque conversion progress audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sxy-macaque-conversion-audit-once.yml'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read resumable conversion progress without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || exit 10
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          echo "REMOTE_LOCAL_TIME=$(date -Is)"
          echo "=== UNIT ==="
          systemctl --user show sxy-macaque-lung-resumable.service -p ActiveState -p SubState -p Result -p NRestarts -p MainPID -p ExecMainStatus --no-pager
          echo "=== REFERENCE_AND_MOUNT ==="
          test -s "$HOME/reference/Macaca_fascicularis_5_0_Ensembl100/reference.json" && echo REFERENCE=READY || echo REFERENCE=MISSING
          mountpoint -q "$HOME/PROJECTS/zhumiao/danxibao2" && echo SOURCE_MOUNT=YES || echo SOURCE_MOUNT=NO
          echo "=== SAMPLES ==="
          python3 - <<'PY'
          from pathlib import Path
          import os
          h=Path.home()
          work=h/"PROJECTS/zhumiao/.sxy_macaca_lung_work"
          root=h/"PROJECTS/zhumiao/danxibao2/数据清理整理/刘光慧食蟹猴肺"
          ids=["YM1","YM2","YM3","YM4","YF1","YF2","YF3","YF4","OM2","OM3","OM4","OF1","OF2","OF3","OF4"]
          total=0
          for x in ids:
              s="Lung_"+x
              dst=root/s
              mex=all((dst/"10x"/n).is_file() for n in ("matrix.mtx.gz","features.tsv.gz","barcodes.tsv.gz"))
              valid=(dst/"VALIDATION_PASS.txt").is_file() and mex
              total+=int(valid)
              local=work/"local_fastqs"/s
              ready=list(local.glob("*.fastq.gz")) if local.exists() else []
              parts=list(local.glob("*.part")) if local.exists() else []
              nbytes=sum(p.stat().st_size for p in parts if p.is_file())
              print(f"SAMPLE={s} MEX_VALID={int(valid)} FASTQ_READY={len(ready)}/8 PART_FILES={len(parts)} PART_GiB={nbytes/1073741824:.3f}",flush=True)
          print(f"VALIDATED_SAMPLES={total}/15",flush=True)
          src=work/"sxy_macaca_lung_pipeline.py"
          print("REMOTE_SCRIPT_PRESENT",int(src.is_file()),flush=True)
          if src.is_file():
              import hashlib
              print("REMOTE_SCRIPT_SHA256",hashlib.sha256(src.read_bytes()).hexdigest(),flush=True)
          PY
          echo "=== LIVE_COPY_OR_COUNT_PROCESSES ==="
          ps -u h3039 -o pid,etime,comm,args --sort=-%cpu | grep -E 'cellranger count|/dd if=|timeout 3600 dd|timeout 900 dd|cellranger-10.0.0|sxy_macaca_lung_pipeline' | grep -v grep | sed -E 's#https?://[^[:space:]]+#URL_REDACTED#g' | head -n 32 || true
          echo "=== LAST_SAMPLE_EVENTS ==="
          journalctl --user -u sxy-macaque-lung-resumable.service --no-pager --output=cat -n 120 2>/dev/null | grep -E 'SAMPLE_COMPLETE|SAMPLE_FAILED|MOUNT_COPY_RETRY|MOUNT_COPY |ALL_15_SAMPLES_COMPLETE|SOURCE_OK|WAIT_REFERENCE|RUN ' | tail -n 24 | sed -E 's#https?://[^[:space:]]+#URL_REDACTED#g' || true
          echo "=== DISK ==="
          df -h "$HOME" | tail -n 1 | awk '{print "DISK_USED="$3,"DISK_FREE="$4}'
          echo AUDIT_PASS
          REMOTE
          unset SSHPASS SXY_PSWD
