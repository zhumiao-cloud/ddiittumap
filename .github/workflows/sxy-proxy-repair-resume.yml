name: SXY proxy repair and macaque resume
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-proxy-repair-resume.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply pinned sh02 proxy repair and resume
        shell: bash
        run: bash scripts/repair_proxy_and_resume_macaque.sh
