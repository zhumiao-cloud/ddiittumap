name: SXY multiome current status
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-current-status.yml'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read current ARC state
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          ROOT=/home/h3039/PROJECTS/zhumiao
          WORK="$ROOT/multiome_arc_work"
          OUT=/home/h3039/PROJECTS/zhumiao/danxibao3/整理转换文件
          echo "NOW=$(date -Is)"
          echo "=== UNITS ==="
          for u in sxy-p10-atac-rebuild-20261012.service sxy-mmul10-multiome-arc-20261010.service; do
            echo "UNIT=$u"
            systemctl --user show "$u" -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts -p MainPID --no-pager 2>/dev/null || true
          done
          echo "=== P10_REBUILD_JOURNAL ==="
          journalctl --user -u sxy-p10-atac-rebuild-20261012.service --no-pager --output=cat -n 80 2>/dev/null | tail -n 80 || true
          echo "=== ARC_JOURNAL ==="
          journalctl --user -u sxy-mmul10-multiome-arc-20261010.service --no-pager --output=cat -n 100 2>/dev/null | tail -n 100 || true
          echo "=== REFERENCE ==="
          test -s /home/h3039/reference/Mmul_10_Ensembl113_ARC220/reference.json && echo REFERENCE_JSON=PASS || echo REFERENCE_JSON=MISSING
          echo "=== WORK_SAMPLES ==="
          for s in P10MK1_1 P10MK2 P20MK3; do
            d="$WORK/$s"
            echo "SAMPLE=$s"
            if [ -d "$d" ]; then
              du -sh "$d" 2>/dev/null || true
              printf "input_fastq="; find "$d/input" -type f -name '*.fastq.gz' 2>/dev/null | wc -l
              printf "input_bytes="; find "$d/input" -type f -name '*.fastq.gz' -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{printf "%.0f\n",s+0}'
              find "$d/pipeline" -maxdepth 3 -type f \( -name '_complete' -o -name 'matrix.mtx.gz' -o -name 'web_summary.html' -o -name '*.bam' \) -printf '%P|%s\n' 2>/dev/null | head -n 40 || true
            else
              echo WORKDIR=MISSING
            fi
          done
          echo "=== REMOTE_OUTPUTS ==="
          for s in P10MK1_1 P10MK2 P20MK3; do
            echo "SAMPLE=$s"
            if timeout 30 rclone lsf "danxibao3_webdav:整理转换文件/$s" --recursive --files-only >/tmp/multiome.$s.list 2>/dev/null; then
              printf "remote_files="; wc -l </tmp/multiome.$s.list
              grep -E '(^|/)(\.fully_verified|matrix\.mtx\.gz|features\.tsv\.gz|barcodes\.tsv\.gz|.*\.bam|.*\.rds)$' /tmp/multiome.$s.list | head -n 50 || true
            else
              echo REMOTE_LIST=FAIL_OR_EMPTY
            fi
          done
          echo "=== ACTIVE_PROCESSES ==="
          ps -u h3039 -o pid,ppid,etime,%cpu,%mem,rss,comm,args --sort=-%cpu | grep -E '[c]ellranger-arc|[s]xy_p10_atac_verified_rebuild|[s]xy_multiome_fast_stage|[r]clone cat danxibao3_webdav|[g]zip -t|[m]d5sum' | head -n 80 || true
          echo "=== DISK ==="
          df -hT /home/h3039 | tail -n 1
          echo STATUS_DONE
          REMOTE
          unset SSHPASS SXY_PSWD
