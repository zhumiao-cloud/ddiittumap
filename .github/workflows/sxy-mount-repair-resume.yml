name: SXY mount repair and macaque resume
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-mount-repair-resume.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Repair danxibao2 mount and resume macaque conversion
        shell: bash
        run: bash scripts/repair_mount_and_resume_macaque.sh
