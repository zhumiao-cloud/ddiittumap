name: Temporary CloudDrive transfer rate limit restoration
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-restore-speeds.yml'
permissions:
  contents: read
jobs:
  restore:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Restore previously known speed limits and verify (exactly 2 settings)
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/cd-rate-restore' EXIT
          mkdir -p /tmp/cd-rate-restore
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-rate-restore/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-rate-restore --python_out=/tmp/cd-rate-restore /tmp/cd-rate-restore/clouddrive.proto
          cat >/tmp/cd-rate-restore/restore.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          
          
          import json,time
          required=["GetSystemSettings","SetSystemSettings","GetUploadFileList","GetDownloadFileList"]
          if any(x not in S.methods_by_name for x in required):raise RuntimeError("Required RPC unavailable")
          getter=S.methods_by_name["GetSystemSettings"]
          setter=S.methods_by_name["SetSystemSettings"]
          outF=[(x.number,x.type,x.name) for x in getter.output_type.fields]
          inF=[(x.number,x.type,x.name) for x in setter.input_type.fields]
          if outF!=inF:raise RuntimeError("Setting schema input/output mismatch - no mutation")
          v=rpc("GetSystemSettings")
          if len(v)!=1:raise RuntimeError("Settings read not unique")
          old=v[0]
          dn=float(old.maxDownloadSpeedKBytesPerSecond);up=float(old.maxUploadSpeedKBytesPerSecond)
          print("LIMIT_BEFORE",json.dumps({"downKiBs":dn,"upKiBs":up}),flush=True)
          if not (dn==20.0 and up==20.0):
           print("NO_CHANGE_UNEXPECTED_CONFIG",json.dumps({"downKiBs":dn,"upKiBs":up}),flush=True)
           raise RuntimeError("Unexpected current limits, manual review required")
          req=cls(setter.input_type)()
          req.ParseFromString(old.SerializeToString())
          req.maxDownloadSpeedKBytesPerSecond=20480.0
          req.maxUploadSpeedKBytesPerSecond=20480.0
          recheck=cls(setter.input_type)()
          recheck.ParseFromString(req.SerializeToString())
          recheck.maxDownloadSpeedKBytesPerSecond=dn
          recheck.maxUploadSpeedKBytesPerSecond=up
          if recheck.SerializeToString()!=old.SerializeToString():
           raise RuntimeError("Detected unexpected settings changed")
          answer=rpc("SetSystemSettings",req)
          print("LIMIT_SET_ACCEPTED",len(answer),flush=True)
          now=rpc("GetSystemSettings")
          if len(now)!=1:raise RuntimeError("Post-settings read empty")
          cur=now[0]
          print("LIMIT_AFTER",json.dumps({"downKiBs":cur.maxDownloadSpeedKBytesPerSecond,"upKiBs":cur.maxUploadSpeedKBytesPerSecond}),flush=True)
          if not(cur.maxDownloadSpeedKBytesPerSecond==20480.0 and cur.maxUploadSpeedKBytesPerSecond==20480.0):
           raise RuntimeError("SetSystemSettings returned but limits unchanged")
          s=cls(getter.output_type)()
          s.ParseFromString(cur.SerializeToString())
          s.maxDownloadSpeedKBytesPerSecond=dn
          s.maxUploadSpeedKBytesPerSecond=up
          if s.SerializeToString()!=old.SerializeToString():
           print("OTHER_SETTINGS_DIFF_WARNING",True,flush=True)
          def measure(label):
           up=rpc("GetUploadFileList",cls(S.methods_by_name["GetUploadFileList"].input_type)())
           down=rpc("GetDownloadFileList")
           uu=up[0];dd=down[0]
           print(label,json.dumps({"uploadBytesPerSec":round(uu.globalBytesPerSecond,1),
           "downloadBytesPerSec":round(dd.globalBytesPerSecond,1),
           "uploadCount":uu.totalCount,"downloadCount":len(dd.downloadFiles),
           "uploadedBytes":uu.finishedBytes,"totalUploadBytes":uu.totalBytes},ensure_ascii=False),flush=True)
          measure("SPEED_SAMPLE_0")
          time.sleep(18)
          measure("SPEED_SAMPLE_18S")
          print("SPEED_TEST_COMPLETE")
          
          PY
          PYTHONPATH=/tmp/cd-rate-restore python3 -u /tmp/cd-rate-restore/restore.py
