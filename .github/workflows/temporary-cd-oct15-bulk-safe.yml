name: Temporary CloudDrive all sync notices acknowledgment
# incremental second pass after live scan repopulated issues
on:
  push:
    paths: ['.github/workflows/temporary-cd-oct15-bulk-safe.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Acknowledge sync notifications only without touching files
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          mkdir -p /tmp/cd-audit
          trap 'rm -rf /tmp/cd-audit' EXIT
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-audit/clouddrive.proto
          python3 -m pip -q install protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-audit --python_out=/tmp/cd-audit /tmp/cd-audit/clouddrive.proto
          cat > /tmp/cd-audit/check.py <<'PY'
          import os, ssl, http.client, struct, json, collections, hashlib
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          token=os.environ["CD_TOKEN"]
          if not token: raise RuntimeError("CD_API_KEY missing")
          svc=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(t): return message_factory.GetMessageClass(t)
          def req(method,r=None):
              d=svc.methods_by_name[method]
              r=r or cls(d.input_type)()
              p=r.SerializeToString()
              c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
              try:
                  c.request("POST",f"/clouddrive.CloudDriveFileSrv/{method}",b"\0"+struct.pack(">I",len(p))+p,{
                      "authorization":"Bearer "+token,"content-type":"application/grpc-web+proto",
                      "accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn"})
                  z=c.getresponse()
                  status=z.status
                  headers={k.lower():v for k,v in z.getheaders()}
                  raw=z.read(12000001)
              finally: c.close()
              if len(raw)>12000000: raise RuntimeError(method+" oversized")
              off=0; tra={}; out=[]
              while off<len(raw):
                  if off+5>len(raw):raise RuntimeError("truncated frame")
                  b=raw[off]; n=int.from_bytes(raw[off+1:off+5],"big"); off+=5
                  if off+n>len(raw):raise RuntimeError("truncated payload")
                  dat=raw[off:off+n];off+=n
                  if b&128:
                      for line in dat.decode("utf-8","replace").splitlines():
                          if ":" in line:
                              k,v=line.split(":",1);tra[k.lower().strip()]=v.strip()
                  else:
                      if b&1:raise RuntimeError("compressed message unsupported")
                      obj=cls(d.output_type)();obj.ParseFromString(dat);out.append(obj)
              grpc=tra.get("grpc-status",headers.get("grpc-status"))
              print("RPC",method,"HTTP",status,"GRPC",grpc or "MISSING","MESSAGES",len(out))
              if status!=200 or grpc!="0":raise RuntimeError(method+" failed; grpc=16 means unauthorized")
              return out
          def ev(msg,name):
              f=msg.DESCRIPTOR.fields_by_name[name]
              return f.enum_type.values_by_number[int(getattr(msg,name))].name
          # User explicitly requests dismissing ALL currently visible synchronization notices.
          # Dismiss means acknowledgement only: never overwrite, adopt, delete or restore files.
          resolution=svc.methods_by_name["BackupResolveSyncIssue"].input_type
          dismiss=resolution.fields_by_name["action"].enum_type.values_by_name["Dismiss"].number
          assert dismiss==0
          def status():
              result=req("BackupGetAll")
              if len(result)!=1:raise RuntimeError("Bad backup inventory response")
              return list(result[0].backups)
          def issues(path):
              rq=cls(svc.methods_by_name["BackupGetSyncIssues"].input_type)(value=path)
              return [x for z in req("BackupGetSyncIssues",rq) for x in z.issues if not x.resolved]
          before=status()
          print("BACKUP_COUNT",len(before),flush=True)
          print("INITIAL_COUNTS",json.dumps([int(b.openSyncIssues) for b in before]),flush=True)
          srcs=[b.backup.sourcePath for b in before]
          if len(set(srcs))!=len(srcs):raise RuntimeError("Duplicate backup sources; stop")
          accepted=0
          rejected=0
          counts=collections.Counter()
          per_backup={}
          for index,src in enumerate(srcs,1):
              finished=set()
              errors=set()
              empty_rechecks=0
              iterations=0
              max_ids=min(12000,max(1000,int(before[index-1].openSyncIssues)+2000))
              while iterations<330 and len(finished)+len(errors)<max_ids:
                  iterations+=1
                  fresh=status()
                  active=next((b for b in fresh if b.backup.sourcePath==src),None)
                  if active is None:
                      print("STOP_SOURCE_DISAPPEARED",index,flush=True)
                      break
                  if not active.openSyncIssues:
                      empty_rechecks+=1
                      if empty_rechecks>=2:break
                      continue
                  notices=issues(src)
                  candidate=[x for x in notices if x.id and x.id not in finished and x.id not in errors]
                  if not candidate:
                      empty_rechecks+=1
                      if empty_rechecks>=2:break
                      continue
                  empty_rechecks=0
                  chunk=candidate[:min(50,max_ids-len(finished)-len(errors))]
                  actionreq=cls(resolution)()
                  actionreq.sourcePath=src
                  actionreq.issueIds.extend([x.id for x in chunk])
                  actionreq.action=dismiss
                  actionreq.confirmed=False
                  answer=req("BackupResolveSyncIssue",actionreq)
                  success=len(answer)==1 and bool(answer[0].success)
                  if success:
                      accepted+=len(chunk)
                      finished.update(x.id for x in chunk)
                      counts.update(ev(x,"kind") for x in chunk)
                  else:
                      rejected+=len(chunk)
                      errors.update(x.id for x in chunk)
                  if iterations%10==0 or not success:
                      print("PROGRESS",json.dumps({"index":index,"accepted":len(finished),"rejected":len(errors),"remaining_now":int(active.openSyncIssues)}),flush=True)
              per_backup[index]={"accepted":len(finished),"rejected":len(errors),"iterations":iterations}
              print("BACKUP_RESULT",json.dumps({"index":index,**per_backup[index]}),flush=True)
          after=status()
          print("FINAL_COUNTS",json.dumps([int(b.openSyncIssues) for b in after]),flush=True)
          print("FINAL_KINDS",json.dumps(dict(counts)),flush=True)
          print("SUMMARY",json.dumps({"accepted":accepted,"rejected":rejected,"before":sum(int(b.openSyncIssues) for b in before),"after":sum(int(b.openSyncIssues) for b in after)}),flush=True)
          if rejected or sum(b.openSyncIssues for b in after):
              raise RuntimeError("Some sync issues remain; review final counts")
          PY
          PYTHONPATH=/tmp/cd-audit python3 /tmp/cd-audit/check.py

# One-time follow-up for newly appeared NotComparable issue after independent audit.
