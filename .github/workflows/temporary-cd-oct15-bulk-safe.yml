name: Temporary CloudDrive Oct15 safe bulk notice acknowledgement
# incremental second pass after live scan repopulated issues
on:
  push:
    paths: ['.github/workflows/temporary-cd-oct15-bulk-safe.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Acknowledge sync notifications only without touching files
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          mkdir -p /tmp/cd-audit
          trap 'rm -rf /tmp/cd-audit' EXIT
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-audit/clouddrive.proto
          python3 -m pip -q install protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-audit --python_out=/tmp/cd-audit /tmp/cd-audit/clouddrive.proto
          cat > /tmp/cd-audit/check.py <<'PY'
          import os, ssl, http.client, struct, json, collections, hashlib
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          token=os.environ["CD_TOKEN"]
          if not token: raise RuntimeError("CD_API_KEY missing")
          svc=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(t): return message_factory.GetMessageClass(t)
          def req(method,r=None):
              d=svc.methods_by_name[method]
              r=r or cls(d.input_type)()
              p=r.SerializeToString()
              c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
              try:
                  c.request("POST",f"/clouddrive.CloudDriveFileSrv/{method}",b"\0"+struct.pack(">I",len(p))+p,{
                      "authorization":"Bearer "+token,"content-type":"application/grpc-web+proto",
                      "accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn"})
                  z=c.getresponse()
                  status=z.status
                  headers={k.lower():v for k,v in z.getheaders()}
                  raw=z.read(12000001)
              finally: c.close()
              if len(raw)>12000000: raise RuntimeError(method+" oversized")
              off=0; tra={}; out=[]
              while off<len(raw):
                  if off+5>len(raw):raise RuntimeError("truncated frame")
                  b=raw[off]; n=int.from_bytes(raw[off+1:off+5],"big"); off+=5
                  if off+n>len(raw):raise RuntimeError("truncated payload")
                  dat=raw[off:off+n];off+=n
                  if b&128:
                      for line in dat.decode("utf-8","replace").splitlines():
                          if ":" in line:
                              k,v=line.split(":",1);tra[k.lower().strip()]=v.strip()
                  else:
                      if b&1:raise RuntimeError("compressed message unsupported")
                      obj=cls(d.output_type)();obj.ParseFromString(dat);out.append(obj)
              grpc=tra.get("grpc-status",headers.get("grpc-status"))
              print("RPC",method,"HTTP",status,"GRPC",grpc or "MISSING","MESSAGES",len(out))
              if status!=200 or grpc!="0":raise RuntimeError(method+" failed; grpc=16 means unauthorized")
              return out
          def ev(msg,name):
              f=msg.DESCRIPTOR.fields_by_name[name]
              return f.enum_type.values_by_number[int(getattr(msg,name))].name
          # This run only acknowledges already preserved conflict copies and expected
          # non-mirrored deletion notices; it never alters content or sync policy.
          action_desc=svc.methods_by_name["BackupResolveSyncIssue"].input_type
          action=action_desc.fields_by_name["action"].enum_type.values_by_name["Dismiss"].number
          assert action==0
          initial=req("BackupGetAll")[0].backups
          assert len(initial)==7,"Backup inventory changed; abort"
          sources=[b.backup.sourcePath for b in initial]
          assert len(set(sources))==len(sources)
          print("INITIAL_COUNTS",json.dumps([int(x.openSyncIssues) for x in initial]),flush=True)
          print("SAFETY_RULE","Dismiss-only, saved conflict copy or nonmirrored Keep deletion; no held guard",flush=True)
          accepted=0
          rejected=0
          by_kind=collections.Counter()
          for i,(first,src) in enumerate(zip(initial,sources),1):
              if not first.openSyncIssues: continue
              if not (first.backup.isEnabled and ev(first.backup,"fileDeleteRule")=="Keep"
                      and not first.backup.syncDeletionsTwoWay and not first.backup.twoWayHardDelete
                      and not first.heldDeletionGuards):
                  print("SKIPPED_PROTECTED",i,int(first.openSyncIssues),flush=True)
                  continue
              budget=int(first.openSyncIssues)
              visited=set()
              failed=set()
              runs=0
              while len(visited)+len(failed)<budget and runs<100:
                  runs+=1
                  state=req("BackupGetAll")[0].backups
                  current=next((b for b in state if b.backup.sourcePath==src),None)
                  if (current is None or not current.backup.isEnabled or current.heldDeletionGuards or
                      ev(current.backup,"fileDeleteRule")!="Keep" or current.backup.syncDeletionsTwoWay or current.backup.twoWayHardDelete):
                      print("STOP_POLICY_CHANGED",i,flush=True)
                      break
                  query=cls(svc.methods_by_name["BackupGetSyncIssues"].input_type)(value=src)
                  notices=[v for response in req("BackupGetSyncIssues",query) for v in response.issues if not v.resolved]
                  safe=[]
                  for x in notices:
                      if not x.id or x.id in visited or x.id in failed: continue
                      kind=ev(x,"kind")
                      delete_rule=ev(x,"deleteRule")
                      if kind=="Conflict" and bool(x.conflictCopyPath) and bool(x.relativePath):
                          safe.append((x.id,kind))
                      elif kind=="DeletionsNotMirrored" and delete_rule=="Keep" and not x.affectedCount:
                          safe.append((x.id,kind))
                  if not safe: break
                  block=safe[:min(40,budget-len(visited)-len(failed))]
                  q=cls(action_desc)()
                  q.sourcePath=src
                  q.issueIds.extend([k for k,_ in block])
                  q.action=action
                  q.confirmed=False
                  response=req("BackupResolveSyncIssue",q)
                  ok=len(response)==1 and bool(response[0].success)
                  if ok:
                      visited.update(k for k,_ in block)
                      accepted+=len(block)
                      by_kind.update(kind for _,kind in block)
                  else:
                      failed.update(k for k,_ in block)
                      rejected+=len(block)
                  if runs%5==0 or not ok:
                      print("PROGRESS",json.dumps({"backup":i,"round":runs,"accepted":len(visited),
                          "rejected":len(failed),"server_open":int(current.openSyncIssues)}),flush=True)
              print("BACKUP_PROCESSED",json.dumps({"backup":i,"accepted":len(visited),"rejected":len(failed),"rounds":runs}),flush=True)
          ending=req("BackupGetAll")[0].backups
          print("FINAL_COUNTS",json.dumps([int(x.openSyncIssues) for x in ending]),flush=True)
          print("RESULT",json.dumps({"accepted":accepted,"rejected":rejected,"kinds":dict(by_kind),
                                     "before":sum(x.openSyncIssues for x in initial),
                                     "after":sum(x.openSyncIssues for x in ending)}),flush=True)
          if rejected:raise RuntimeError("Some acknowledgements rejected")
          PY
          PYTHONPATH=/tmp/cd-audit python3 /tmp/cd-audit/check.py
