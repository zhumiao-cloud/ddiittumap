name: Temporary VPS network interface telemetry
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-20261015-vps-metrics.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read-only 1Panel NIC, CPU and memory telemetry across two time points
        shell: bash
        env:
          PANEL_KEY: ${{ secrets.PANEL_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$PANEL_KEY"
          echo "::add-mask::$PANEL_KEY"
          python3 - <<'PY'
          import os,time,hashlib,http.client,ssl,json,socket
          key=os.environ["PANEL_KEY"]
          def request(path):
           ts=str(int(time.time()))
           token=hashlib.md5(("1panel"+key+ts).encode()).hexdigest()
           c=http.client.HTTPSConnection("panel.evren.cn",443,timeout=20,context=ssl.create_default_context())
           try:
            c.request("GET",path,headers={"1Panel-Timestamp":ts,"1Panel-Token":token,"Accept":"application/json"})
            r=c.getresponse();raw=r.read(200000)
           finally:c.close()
           try:body=json.loads(raw)
           except Exception:body={}
           print("PANEL_REQUEST",json.dumps({"urlType":path.split("/")[4:],"status":r.status,"apiCode":body.get("code"),"dataType":type(body.get("data")).__name__}),flush=True)
           if r.status!=200:raise RuntimeError("Panel metrics HTTP access denied")
           return body.get("data",{}) or {}
          def scalar(data):
           return {k:v for k,v in data.items() if isinstance(v,(int,float,bool)) and any(s in k.lower() for s in ("cpu","memory","swap","net","load","read","write","disk","io"))}
          try:
           b=request("/api/v2/dashboard/base/all/all")
           print("BASE_METRIC_KEYS",sorted(k for k in b.keys() if any(s in k.lower() for s in ("cpu","net","host","ip","memory","disk","io"))))
          except Exception as e:print("BASE_ERR",type(e).__name__)
          snapshots=[]
          for i in range(3):
           try:
            v=request("/api/v2/dashboard/current/all/all")
            print("NIC_SNAPSHOT",json.dumps({"index":i,"fields":scalar(v),"allKeys":sorted(v.keys())}),flush=True)
            snapshots.append((time.monotonic(),v))
           except Exception as e:
            print("NIC_SNAPSHOT_FAILED",type(e).__name__,flush=True)
           if i<2:time.sleep(12)
          if len(snapshots)>1:
           for (ta,a),(tb,b) in zip(snapshots,snapshots[1:]):
            delta=tb-ta
            out={"seconds":round(delta,2)}
            for key in ("netBytesSent","netBytesRecv","ioReadBytes","ioWriteBytes"):
             if key in a and key in b:
              out[key+"RateBps"]=round((b[key]-a[key])/delta,2)
            print("VPS_INTERFACE_DELTA",json.dumps(out),flush=True)
          PY
