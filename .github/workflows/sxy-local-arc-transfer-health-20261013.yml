name: SXY local ARC transfer health one shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-local-arc-transfer-health-20261013.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Inspect local staging growth and worker IO without modifying data
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || exit 14
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "AUDIT_TIME=$(date -Is)"
          systemctl --user show sxy-mmul10-multiome-local-two-v2-20261013.service -p ActiveState -p MainPID -p Result -p ExecMainStatus
          D=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK2
          for p in "$D/input/GEX" "$D/input/ATAC"; do
            if [ -d "$p" ]; then du -sB1 "$p"; find "$p" -maxdepth 1 -type f -printf 'BYTES=%s MTIME=%TY-%Tm-%Td_%TH:%TM:%TS NAME=%f\n' | head -n 18; fi
          done
          echo "=== IO_PIDS ==="
          for p in $(pgrep -u h3039 -x rclone || true); do
            if tr '\0' ' ' < "/proc/$p/cmdline" | grep -Fq '/P10MK2'; then
              echo "TARGET_RCLONE_PID=$p"
              grep -E 'rchar:|wchar:|read_bytes:|write_bytes:' "/proc/$p/io" || true
              ps -p "$p" -o pid=,etimes=,pcpu=,pmem=,state=,comm=
            fi
          done
          echo "=== LATEST_EVENTS ==="
          journalctl --user -u sxy-mmul10-multiome-local-two-v2-20261013.service --no-pager --output=cat -n 12 | cut -c1-180
          echo "DISK_AVAILABLE_BYTES=$(df -B1 --output=avail "$D" | tail -n 1 | tr -d ' ')"
          echo TRANSFER_HEALTH_DONE
          REMOTE
          unset SSHPASS SXY_PSWD
