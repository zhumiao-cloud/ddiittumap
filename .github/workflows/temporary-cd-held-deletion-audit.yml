name: One-time CloudDrive inspect held deletions
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-held-deletion-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.event_name == 'push' && github.actor == 'zhumiao-cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Read held deletion state without modifying files
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/cd-held' EXIT
          mkdir -p /tmp/cd-held
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-held/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-held --python_out=/tmp/cd-held /tmp/cd-held/clouddrive.proto
          cat > /tmp/cd-held/inspect.py <<'PY'
          import os,ssl,http.client,struct,collections,json,hashlib
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]
          svc=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(desc):return message_factory.GetMessageClass(desc)
          def enum(field,v):return field.enum_type.values_by_number[int(v)].name
          def digest(x):return hashlib.sha256(str(x).encode()).hexdigest()[:12]
          def rpc(name,q=None):
           m=svc.methods_by_name[name]; req=q if q is not None else cls(m.input_type)()
           b=req.SerializeToString();c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=45,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+name,b"\0"+struct.pack(">I",len(b))+b,{"content-type":"application/grpc-web+proto","x-grpc-web":"1","authorization":"Bearer "+TOKEN,"origin":"https://cd.evren.cn"})
            r=c.getresponse();http_code=r.status;heads={k.lower():v for k,v in r.getheaders()};raw=r.read(16000001)
           finally:c.close()
           if len(raw)>16000000:raise RuntimeError("Response too large")
           pos=0;tr={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("Truncated gRPC frame")
            flag=raw[pos];size=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+size>len(raw):raise RuntimeError("Invalid gRPC frame")
            data=raw[pos:pos+size];pos+=size
            if flag&0x80:
             for line in data.decode("utf-8","replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);tr[k.strip().lower()]=v.strip()
            else:
             if flag&1:raise RuntimeError("Compressed gRPC frame not supported")
             x=cls(m.output_type)();x.ParseFromString(data);out.append(x)
           status=tr.get("grpc-status",heads.get("grpc-status"))
           print("RPC",name,"HTTP",http_code,"grpc",status,flush=True)
           if http_code!=200 or status!="0":raise RuntimeError(f"{name} failed HTTP={http_code} gRPC={status}")
           return out
          print("RESOLVE_ENUM",[(x.name,x.number) for x in svc.methods_by_name["BackupResolveSyncIssue"].input_type.fields_by_name["action"].enum_type.values],flush=True)
          print("SYNC_ISSUE_SCHEMA",[(f.name,f.type,f.is_repeated) for f in svc.methods_by_name["BackupGetSyncIssues"].output_type.fields_by_name["issues"].message_type.fields],flush=True)
          print("DELETE_RELATED_METHODS",[m.name for m in svc.methods if any(z in m.name.lower() for z in ("backup","delet","guard","held","confirm"))],flush=True)
          rows=rpc("BackupGetAll")
          if len(rows)!=1:raise RuntimeError("backup count malformed")
          for idx,b in enumerate(rows[0].backups,1):
           p=b.backup.sourcePath
           print("BACKUP",json.dumps({"index":idx,"source_hash":digest(p),"encrypted_name_match":("加密" in p or "encrypt" in p.lower()),"enabled":b.backup.isEnabled,"status":enum(b.DESCRIPTOR.fields_by_name["status"],b.status),"delete_policy":enum(b.backup.DESCRIPTOR.fields_by_name["fileDeleteRule"],b.backup.fileDeleteRule),"two_way_delete":bool(b.backup.syncDeletionsTwoWay),"hard_delete":bool(b.backup.twoWayHardDelete),"heldDeletionGuards":int(b.heldDeletionGuards),"openSyncIssues":int(b.openSyncIssues),"last_errors_count":len(b.errors)},ensure_ascii=False),flush=True)
           rq=cls(svc.methods_by_name["BackupGetSyncIssues"].input_type)();rq.value=p
           issues=[x for r in rpc("BackupGetSyncIssues",rq) for x in r.issues if not x.resolved]
           kinds=collections.Counter(enum(x.DESCRIPTOR.fields_by_name["kind"],x.kind) for x in issues)
           print("ISSUE_SUMMARY",idx,json.dumps(kinds,ensure_ascii=False),flush=True)
           for x in issues:
            kind=enum(x.DESCRIPTOR.fields_by_name["kind"],x.kind)
            if any(w in kind.lower() for w in ("delet","held","guard","mass","confirm")) or b.heldDeletionGuards:
             print("DELETE_CANDIDATE",json.dumps({"backup_index":idx,"issue_id":str(x.id),"kind":kind,"affected_count":x.affectedCount,"affected_folders":x.affectedFolders,"affected_paths_returned":len(x.affectedPaths),"replica_hash":digest(x.replica),"file_path_hash":digest(x.relativePath),"delete_rule":enum(x.DESCRIPTOR.fields_by_name["deleteRule"],x.deleteRule),"detail_hash":digest(x.detail),"detail_chars":len(x.detail)},ensure_ascii=False),flush=True)
           if b.heldDeletionGuards:
            req=cls(svc.methods_by_name["BackupGetStatus"].input_type)();req.value=p
           status=rpc("BackupGetStatus",req)
           if status:
            x=status[0]
            print("HELD_GUARD_STATUS",json.dumps({"backup_index":idx,"held":int(x.heldDeletionGuards),"open_issues":int(x.openSyncIssues),"state":enum(x.DESCRIPTOR.fields_by_name["status"],x.status)},ensure_ascii=False),flush=True)
          PY
          PYTHONPATH=/tmp/cd-held python3 -u /tmp/cd-held/inspect.py
