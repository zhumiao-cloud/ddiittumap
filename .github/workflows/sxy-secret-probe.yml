name: SXY secret probe
on:
  push:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Verify configured secret
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo SXY_SECRET_CONFIGURED

# trigger probe
