name: SXY macaque deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-macaque-deploy.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run vetted deployment
        shell: bash
        run: bash scripts/deploy_macaque.sh
