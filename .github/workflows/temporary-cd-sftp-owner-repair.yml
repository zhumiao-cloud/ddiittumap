name: Temporary targeted SFTP ownership marker recovery
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-sftp-owner-repair.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Disable stale SFTP ownership guard and request targeted rescan
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/sftp-owner-once' EXIT
          mkdir -p /tmp/sftp-owner-once
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/sftp-owner-once/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/sftp-owner-once --python_out=/tmp/sftp-owner-once /tmp/sftp-owner-once/clouddrive.proto
          cat >/tmp/sftp-owner-once/repair.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          
          import time
          from google.protobuf import json_format
          clouds=rpc("GetAllCloudApis")
          apis=[a for x in clouds for a in x.apis]
          sftps=[a.path for a in apis if ("sftp"==a.name.strip().lower() or "sftp"==a.path.rstrip("/").split("/")[-1].lower())]
          if len(sftps)!=1:raise RuntimeError("Not unique SFTP storage; no mutation")
          root=sftps[0]
          allbacks=rpc("BackupGetAll")[0].backups
          matches=[b for b in allbacks if (under(b.backup.sourcePath,root) or under(root,b.backup.sourcePath))]
          if len(matches)!=1:raise RuntimeError("Expected one unique SFTP-root source backup; no mutation")
          b=matches[0];backup=b.backup
          if backup.sourcePath!=root:raise RuntimeError("SFTP backup must exactly equal storage root")
          overlap=[]
          for x in allbacks:
           if x.backup.sourcePath==backup.sourcePath:continue
           if any(related(p,q) for p in [backup.sourcePath]+[d.destinationPath for d in backup.destinations] for q in [x.backup.sourcePath]+[d.destinationPath for d in x.backup.destinations]):overlap.append(digest(x.backup.sourcePath))
          if overlap:raise RuntimeError("Overlapping backup detected; will not relax owner guard")
          if not (backup.isEnabled and name(backup,"syncMode")=="BackupTwoWay" and backup.syncOwnerMarker and
                  not backup.syncDeletionsTwoWay and not backup.twoWayHardDelete and
                  name(backup,"fileDeleteRule")=="Keep" and b.heldDeletionGuards==0):
           raise RuntimeError("SFTP safe preconditions do not hold")
          rq=cls(S.methods_by_name["BackupGetSyncIssues"].input_type)();rq.value=backup.sourcePath
          issues=[i for r in rpc("BackupGetSyncIssues",rq) for i in r.issues]
          owned=[i for i in issues if name(i,"kind")=="SharedReplica" and cat(i.detail)=="OWNER_CONFLICT" and i.replica==backup.sourcePath and not i.resolved]
          print("BEFORE",json.dumps({"sftpHash":digest(backup.sourcePath),"issueCount":len(issues),"sharedReplicaMatches":len(owned),"errorClasses":dict(collections.Counter(cat(x.message) for x in b.errors)),"status":name(b,"status"),"ownerMarker":backup.syncOwnerMarker},ensure_ascii=False))
          if len(owned)!=1 or len(issues)!=1:raise RuntimeError("SFTP issue inventory is not the single expected SharedReplica; no mutation")
          update_desc=S.methods_by_name["BackupUpdate"].input_type
          print("SCHEMA_CHECK",update_desc.full_name,backup.DESCRIPTOR.full_name)
          if update_desc.full_name!=backup.DESCRIPTOR.full_name:raise RuntimeError("BackupUpdate schema mismatch")
          request=cls(update_desc)()
          request.CopyFrom(backup)
          request.syncOwnerMarker=False
          backup_hash=digest(backup.sourcePath)
          old_config={
          "sourcePath":backup.sourcePath,"destinations":tuple(d.destinationPath for d in backup.destinations),
          "fileReplaceRule":backup.fileReplaceRule,"fileDeleteRule":backup.fileDeleteRule,
          "fileCompletionRule":backup.fileCompletionRule,"isEnabled":backup.isEnabled,
          "fileSystemWatchEnabled":backup.fileSystemWatchEnabled,
          "walkingThroughIntervalSecs":backup.walkingThroughIntervalSecs,
          "forceWalkingThroughOnStart":backup.forceWalkingThroughOnStart,
          "syncMode":backup.syncMode,"conflictPolicy":backup.conflictPolicy,
          "syncDeletionsTwoWay":backup.syncDeletionsTwoWay,
          "twoWayHardDelete":backup.twoWayHardDelete,"bootstrapExtrasPolicy":backup.bootstrapExtrasPolicy,
          "massDeleteGuardPercent":backup.massDeleteGuardPercent,"deepScanEnabled":backup.deepScanEnabled,
          "deepScanEveryPasses":backup.deepScanEveryPasses,"deepScanMaxHours":backup.deepScanMaxHours,
          "rules":backup.fileBackupRules.SerializeToString() if hasattr(backup.fileBackupRules,"SerializeToString") else repr(backup.fileBackupRules)}
          result=rpc("BackupUpdate",request)
          print("CHANGE","SFTP_OWNER_MARKER_DISABLED","response_messages",len(result))
          def get_sftp():
           a=rpc("BackupGetAll")[0].backups
           x=[z for z in a if z.backup.sourcePath==root]
           if len(x)!=1:raise RuntimeError("SFTP backup missing after update")
           return x[0]
          after=get_sftp();v=after.backup
          new_config={
          "sourcePath":v.sourcePath,"destinations":tuple(d.destinationPath for d in v.destinations),
          "fileReplaceRule":v.fileReplaceRule,"fileDeleteRule":v.fileDeleteRule,
          "fileCompletionRule":v.fileCompletionRule,"isEnabled":v.isEnabled,
          "fileSystemWatchEnabled":v.fileSystemWatchEnabled,
          "walkingThroughIntervalSecs":v.walkingThroughIntervalSecs,
          "forceWalkingThroughOnStart":v.forceWalkingThroughOnStart,
          "syncMode":v.syncMode,"conflictPolicy":v.conflictPolicy,
          "syncDeletionsTwoWay":v.syncDeletionsTwoWay,
          "twoWayHardDelete":v.twoWayHardDelete,"bootstrapExtrasPolicy":v.bootstrapExtrasPolicy,
          "massDeleteGuardPercent":v.massDeleteGuardPercent,"deepScanEnabled":v.deepScanEnabled,
          "deepScanEveryPasses":v.deepScanEveryPasses,"deepScanMaxHours":v.deepScanMaxHours,
          "rules":v.fileBackupRules.SerializeToString() if hasattr(v.fileBackupRules,"SerializeToString") else repr(v.fileBackupRules)}
          print("CONFIG_CHECK","unchanged_except_marker",old_config==new_config,"marker_disabled",not v.syncOwnerMarker)
          if v.syncOwnerMarker or old_config!=new_config:raise RuntimeError("Post-change settings inconsistent; manual review required")
          r=cls(S.methods_by_name["BackupRestartWalkingThrough"].input_type)()
          r.value=root
          rpc("BackupRestartWalkingThrough",r)
          print("RESCAN","requested","target",backup_hash)
          time.sleep(35)
          after2=get_sftp()
          rq=cls(S.methods_by_name["BackupGetSyncIssues"].input_type)();rq.value=root
          issues=[i for r in rpc("BackupGetSyncIssues",rq) for i in r.issues]
          print("AFTER",json.dumps({"status":name(after2,"status"),"ownerMarker":after2.backup.syncOwnerMarker,
            "openIssues":after2.openSyncIssues,"returnedIssues":len(issues),"issuesByType":dict(collections.Counter(name(i,"kind") for i in issues)),
            "errorsListed":len(after2.errors),"errorClasses":dict(collections.Counter(cat(e.message) for e in after2.errors)),
            "scanGeneration":getfield(after2.syncStats,"generation",0),
            "lastPassAt":getfield(after2.syncStats.lastPassAt,"seconds",0)},ensure_ascii=False))
          print("TARGET_REPAIR","config_applied_and_rescan_started")
          PY
          PYTHONPATH=/tmp/sftp-owner-once python3 -u /tmp/sftp-owner-once/repair.py
