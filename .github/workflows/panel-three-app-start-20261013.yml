name: Temporary scoped start of three 1Panel applications
on:
  push:
    paths:
      - '.github/workflows/panel-three-app-start-20261013.yml'
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
    steps:
      - name: Start existing app installs with no rebuild or destructive operations
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$PANEL_API_KEY" || { echo 'ERROR=SECRET_MISSING'; exit 12; }
          echo "::add-mask::$PANEL_API_KEY"
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          auth() {
            TS="$(date +%s)"
            TOKEN="$(printf '1panel%s%s' "$PANEL_API_KEY" "$TS" | md5sum | cut -d' ' -f1)"
            echo "::add-mask::$TOKEN" >&2
          }
          post() {
            local endpoint="$1" body="$2"
            auth
            curl -sS --connect-timeout 12 --max-time 60 \
              -H "1Panel-Token: $TOKEN" -H "1Panel-Timestamp: $TS" \
              -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data "$body" "https://panel.evren.cn/api/v2/$endpoint"
          }
          get() {
            local endpoint="$1"
            auth
            curl -sS --connect-timeout 12 --max-time 35 \
              -H "1Panel-Token: $TOKEN" -H "1Panel-Timestamp: $TS" \
              -H 'Accept: application/json' "https://panel.evren.cn/api/v2/$endpoint"
          }
          get containers/docker/status > "$work/docker.json"
          jq -e '.code==200 and .data.isActive==true and .data.isExist==true' "$work/docker.json" >/dev/null || { echo 'DOCKER_NOT_READY'; exit 13; }
          post apps/installed/search '{"page":1,"pageSize":500,"name":"","tags":[],"update":false,"unused":false,"all":true,"sync":false,"checkUpdate":false}' > "$work/before.json"
          jq -e '(.data.items // [])|any(.id==21 and .appKey=="halo" and .status=="Error")' "$work/before.json" >/dev/null
          jq -e '(.data.items // [])|any(.id==25 and .appKey=="n8n" and .status=="Error")' "$work/before.json" >/dev/null
          jq -e '(.data.items // [])|any(.id==26 and .appKey=="stalwart-mail" and .status=="Error")' "$work/before.json" >/dev/null
          echo 'PRECHECK=ALL_THREE_ERROR_CONFIRMED'
          for target in 'halo:21' 'n8n:25' 'stalwart-mail:26'; do
            IFS=':' read -r name id <<< "$target"
            echo "NATIVE_START_REQUEST=$name"
            post apps/installed/op "$(jq -nc --argjson id "$id" '{installId:$id,operate:"start",backup:false,pullImage:false,deleteImage:false,forceDelete:false,deleteDB:false,deleteBackup:false}')" > "$work/start.json"
            python3 - "$work/start.json" "$name" <<'PY'
          import json,sys,re
          try:d=json.load(open(sys.argv[1]))
          except:print('START',sys.argv[2],'non_json_response');raise SystemExit(2)
          m=str(d.get('message') or '')
          patterns={'compose':r'compose','docker':r'docker','port_conflict':r'address already in use|port is already allocated',
          'missing_file':r'no such file|file not found','permission_denied':r'permission denied','disk_full':r'no space left',
          'image_pull':r'failed to pull|manifest unknown','network':r'network.*(fail|unavailable)|timeout'}
          print('START_RESULT',json.dumps({'name':sys.argv[2],'code':d.get('code'),'message_length':len(m),'hints':[k for k,p in patterns.items() if re.search(p,m,re.I)],'has_data':bool(d.get('data'))}))
          PY
            sleep 8
          done
          sleep 15
          post apps/installed/search '{"page":1,"pageSize":500,"name":"","tags":[],"update":false,"unused":false,"all":true,"sync":true,"checkUpdate":false}' > "$work/after.json"
          post containers/search '{"page":1,"pageSize":500,"name":"","state":"all","filters":"","orderBy":"createdAt","order":"null"}' > "$work/containers.json"
          python3 - "$work/after.json" "$work/containers.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));c=json.load(open(sys.argv[2]))
          for id,key in [(21,'halo'),(25,'n8n'),(26,'stalwart-mail')]:
              x=next((v for v in (a.get('data') or {}).get('items',[]) if v.get('id')==id),{})
              name=x.get('container','')
              matches=[v for v in (c.get('data') or {}).get('items',[]) if v.get('name')==name]
              print('POST_START_STATE',json.dumps({'name':key,'status':x.get('status'),'container_present':bool(matches),'container_state':matches[0].get('state') if matches else None,'error_message_length':len(str(x.get('message') or ''))}))
          PY
          echo 'START_PASS_COMPLETE=true'