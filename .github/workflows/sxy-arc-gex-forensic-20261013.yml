name: SXY ARC GEX stalled copy forensic check
on:
  push:
    paths:
      - '.github/workflows/sxy-arc-gex-forensic-20261013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect source metadata and local active downloads read only
        env:
          SXY_PSWD: ${{ secrets.SXY_PSWD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -qq -y sshpass >/dev/null
          install -d -m 700 ~/.ssh
          ssh-keyscan -p 20111 sxycloud1.top > ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          echo "TIME=$(date -Is)"
          systemctl --user show sxy-mmul10-multiome-local-two-v2-20261013.service -p ActiveState -p MainPID -p Result
          D=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK2/input/GEX
          echo '=== GEX_LOCAL ==='
          find "$D" -maxdepth 1 -type f -printf '%f|%s|%TY-%Tm-%TdT%TH:%TM:%TS\n' | sort
          echo '=== GEX_SOURCE_METADATA ==='
          timeout 75 rclone lsjson danxibao3_webdav:P10MK2/GEX --files-only | python3 -c 'import json,sys; [print("SOURCE|%s|%s"%(x["Name"],x["Size"])) for x in json.load(sys.stdin)]'
          echo '=== RCLONE_TARGET_PROCESSES ==='
          for p in $(pgrep -u h3039 -x rclone || true); do
            if tr '\0' ' ' < "/proc/$p/cmdline" | grep -Fq '/P10MK2'; then
              echo "RCLONE_PID=$p"
              ps -p "$p" -o pid=,etimes=,state=,comm=
              grep -E 'write_bytes:|wchar:' "/proc/$p/io" || true
              ls -l "/proc/$p/fd" 2>/dev/null | grep -E 'P10MK2|\.partial|\.fastq' | head -15 || true
            fi
          done
          echo '=== WEBDAV_MOUNT_AND_CACHE ==='
          findmnt -T /home/h3039/PROJECTS/zhumiao/danxibao3 -o TARGET,SOURCE,FSTYPE,OPTIONS -n | cut -c 1-400 || true
          for d in /home/h3039/.cache/rclone /home/h3039/.cache/rclone/vfs /tmp/rclone; do
            if test -d "$d"; then du -sh "$d" 2>/dev/null || true; find "$d" -mindepth 1 -maxdepth 2 -type d | head -25; fi
          done
          ps -u h3039 -o pid=,comm=,args= | grep -E '[r]clone (mount|serve)|[r]clone copy' | cut -c1-250 | head -20 || true
          echo '=== CAPACITY ==='
          df -h /home/h3039/PROJECTS/zhumiao/multiome_arc_work
          echo FORENSIC_DONE
          REMOTE
          unset SSHPASS SXY_PSWD