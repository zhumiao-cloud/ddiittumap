name: SXY multiome ARC status
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-status.yml'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Inspect existing multiome ARC job
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -u
          echo "NOW=$(date -Is)"
          for unit in sxy-mmul10-multiome-arc-20261010 sxy-mmul10-multiome-arc-parallel-20261010; do
            echo "=== UNIT $unit ==="
            systemctl --user show "$unit" -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager 2>/dev/null || true
            journalctl --user -u "$unit" --no-pager --output=cat -n 100 2>/dev/null | tail -n 100 || true
          done
          echo '=== REFERENCE ==='
          ref="$HOME/reference/Mmul_10_Ensembl113_ARC220"
          if [ -s "$ref/reference.json" ]; then
            echo REFERENCE_READY=YES
            stat -c 'REFERENCE_JSON_SIZE=%s MTIME=%y' "$ref/reference.json"
            python3 - "$ref/reference.json" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1]))
          for k in ("genomes","organism","assembly","version"):
              if k in j: print(f"{k}={j[k]}")
          PY
          else
            echo REFERENCE_READY=NO
          fi
          echo '=== BUILD_INPUTS ==='
          find "$HOME/reference/.Mmul_10_Ensembl113_ARC220_build/inputs" -maxdepth 1 -type f -printf '%f|%s|%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | sort || true
          echo '=== WORK ==='
          work="$HOME/PROJECTS/zhumiao/multiome_arc_work"
          du -sh "$work" 2>/dev/null || true
          find "$work" -mindepth 1 -maxdepth 4 -type f \( -name '.fully_verified' -o -name 'cellranger_arc_console.log' -o -name 'matrix.mtx.gz' -o -name '*.bam' \) -printf '%P|%s|%TY-%Tm-%TdT%TH:%TM:%TS\n' 2>/dev/null | head -n 100 || true
          echo '=== REMOTE FINAL ==='
          for s in P10MK1_1 P10MK2 P20MK3; do
            echo "SAMPLE=$s"
            timeout 40 rclone lsf "danxibao3_webdav:整理转换文件/$s" --recursive --files-only 2>/dev/null | head -n 40 || true
          done
          echo '=== PROCESSES ==='
          ps -u h3039 -o pid,ppid,%cpu,%mem,etime,comm,args --sort=-%cpu 2>/dev/null | grep -E 'sxy_mmul10|arc_multiome|cellranger-arc|martian|STAR|curl.*Macaca_mulatta|rclone.*danxibao3' | grep -v grep | head -n 80 || true
          echo '=== DISK ==='
          df -hT "$HOME" | tail -n 1
          REMOTE
          unset SSHPASS SXY_PSWD
