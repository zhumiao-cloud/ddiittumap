name: Temporary CloudDrive six-backup read-only diagnosis
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-six-backup-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read current backup state using official gRPC-Web proto
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/cd-once' EXIT
          mkdir -p /tmp/cd-once
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-once/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-once --python_out=/tmp/cd-once /tmp/cd-once/clouddrive.proto
          cat > /tmp/cd-once/audit.py <<'PY'
          import os, ssl, http.client, struct, json, hashlib, re, collections, sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          
          TOKEN=os.environ.get("CD_TOKEN","")
          if not TOKEN: raise RuntimeError("CD_API_KEY secret missing")
          SVC=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          
          def h(x): return hashlib.sha256(str(x).encode("utf-8","replace")).hexdigest()[:12]
          def cls(descriptor): return message_factory.GetMessageClass(descriptor)
          
          def rpc(method, request=None):
              m=SVC.methods_by_name[method]
              request=request if request is not None else cls(m.input_type)()
              payload=request.SerializeToString()
              framed=b"\0"+struct.pack(">I",len(payload))+payload
              c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=35,context=ssl.create_default_context())
              try:
                  c.request("POST",f"/clouddrive.CloudDriveFileSrv/{method}",framed,{
                    "content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto",
                    "x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
                  response=c.getresponse()
                  code=response.status
                  headers={k.lower():v for k,v in response.getheaders()}
                  raw=response.read(8_000_001)
              finally: c.close()
              if len(raw)>8_000_000: raise RuntimeError(method+": oversized response")
              pos=0; trailers={}; messages=[]
              while pos<len(raw):
                  if pos+5>len(raw): raise RuntimeError(method+": truncated frame")
                  flag=raw[pos]; n=int.from_bytes(raw[pos+1:pos+5],"big"); pos+=5
                  if pos+n>len(raw): raise RuntimeError(method+": invalid frame length")
                  dat=raw[pos:pos+n]; pos+=n
                  if flag & 0x80:
                      for line in dat.decode("utf-8","replace").splitlines():
                          if ":" in line:
                              k,v=line.split(":",1)
                              trailers[k.lower().strip()]=v.strip()
                  else:
                      if flag & 1: raise RuntimeError(method+": compressed payload unsupported")
                      v=cls(m.output_type)(); v.ParseFromString(dat); messages.append(v)
              status=trailers.get("grpc-status",headers.get("grpc-status"))
              print("RPC",method,"HTTP",code,"grpc-status",status or "MISSING","messages",len(messages))
              if code != 200 or status != "0":
                  raise RuntimeError(method+": HTTP/grpc not successful (especially code 16 means unauthenticated)")
              return messages
          
          def fields(d): return [(f.name, f.type, f.is_repeated, f.message_type.full_name if f.message_type else "") for f in d.fields]
          def classify(s):
              s=s.lower()
              rules=[
               ("AUTH",r"unauthori[sz]|permission|forbidden|access denied|token|authenticat|401|403|认证|无权限|权限不足"),
               ("MISSING_SOURCE",r"not found|no such file|不存在|未找到|404|源文件"),
               ("CONFLICT",r"conflict|already exists|overwrit|replace|duplicate|same name|覆盖|冲突|重复|同名"),
               ("DELETION",r"delet|remov|trash|删除|回收站|移动到"),
               ("TRANSIENT_NETWORK",r"timeout|timed out|network|connect|reset|temporar|rate.limit|429|超时|网络|连接|限流"),
               ("QUOTA",r"quota|no space|storage full|磁盘空间|空间不足|容量"),
               ("LOCKED",r"lock|busy|占用|锁定|正在使用"),
               ("UNSUPPORTED",r"unsupported|not supported|不支持|非法字符|文件名不合法"),
               ("IGNORE",r"ignore|skip|忽略|跳过"),
              ]
              return next((n for n,p in rules if re.search(p,s)),"OTHER")
          def safe_value(f,v):
              if f.type==f.TYPE_ENUM:
                  e=f.enum_type.values_by_number.get(int(v))
                  return e.name if e else int(v)
              if f.type==f.TYPE_BOOL: return bool(v)
              if f.type in (f.TYPE_INT32,f.TYPE_INT64,f.TYPE_UINT32,f.TYPE_UINT64,f.TYPE_SINT32,f.TYPE_SINT64,f.TYPE_DOUBLE,f.TYPE_FLOAT): return v
              if f.type in (f.TYPE_STRING,f.TYPE_BYTES):
                  if any(x in f.name.lower() for x in ("error","message","reason","detail")):
                      return {"category":classify(str(v)),"present":bool(v),"hash":h(v)}
                  return {"present":bool(v),"hash":h(v)}
              return "unknown"
          def summarize(msg,depth=0):
              result={}
              if depth>4: return {"nested":"depth_limit"}
              for f,v in msg.ListFields():
                  if f.type==f.TYPE_MESSAGE:
                      if f.is_repeated:
                          result[f.name]={"count":len(v),"sample":[summarize(z,depth+1) for z in list(v)[:8]]}
                      else: result[f.name]=summarize(v,depth+1)
                  elif f.is_repeated:
                      result[f.name]={"count":len(v),"sample":[safe_value(f,z) for z in list(v)[:8]]}
                  else:
                      result[f.name]=safe_value(f,v)
              return result
          
          names=[x.name for x in SVC.methods if any(k in x.name.lower() for k in ("backup","ignore","error","conflict","confirm","sync"))]
          print("RELATED_METHODS",json.dumps(names,ensure_ascii=False))
          for n in names:
              m=SVC.methods_by_name[n]
              if any(k in n.lower() for k in ("backup","ignore","confirm","conflict")):
                  print("SCHEMA",n,"INPUT",json.dumps(fields(m.input_type),ensure_ascii=False),
                        "OUTPUT",json.dumps(fields(m.output_type),ensure_ascii=False)[:3500])
          print("ISSUE_SCHEMA",json.dumps(fields(SVC.methods_by_name["BackupGetSyncIssues"].output_type.fields_by_name["issues"].message_type),ensure_ascii=False))
          actiontype=SVC.methods_by_name["BackupResolveSyncIssue"].input_type.fields_by_name["action"].enum_type
          print("RESOLUTION_ACTIONS",json.dumps([(v.name,v.number) for v in actiontype.values],ensure_ascii=False))
          try:
              statuses=rpc("BackupGetAll")
              backs=list(statuses[0].backups)
              print("BACKUP_COUNT",len(backs))
              for i,b in enumerate(backs,1):
                  src=b.backup.sourcePath
                  errors=list(b.errors)
                  ecount=collections.Counter(classify(getattr(e,"message","")) for e in errors)
                  d={"index":i,"source_hash":h(src),"status":safe_value(b.DESCRIPTOR.fields_by_name["status"],b.status),
                    "enabled":b.backup.isEnabled,"dest_count":len(b.backup.destinations),
                    "open_issue_count":b.openSyncIssues,"listed_error_count":len(errors),
                    "error_classes":dict(ecount)}
                  print("BACKUP",json.dumps(d,ensure_ascii=False))
                  req=cls(SVC.methods_by_name["BackupGetSyncIssues"].input_type)()
                  req.value=src
                  try:
                      replies=rpc("BackupGetSyncIssues",req)
                      allissues=[item for reply in replies for item in reply.issues]
                      sigcounts=collections.Counter()
                      cats=collections.Counter()
                      examples={}
                      for issue in allissues:
                          sig=tuple((f.name,str(safe_value(f,v))) for f,v in issue.ListFields() if f.type==f.TYPE_ENUM)
                          s=str(sig)
                          sigcounts[s]+=1
                          for f,v in issue.ListFields():
                              if f.type==f.TYPE_STRING and any(k in f.name.lower() for k in ("message","reason","detail","error")): cats[classify(str(v))]+=1
                          if s not in examples: examples[s]=summarize(issue)
                      print("ISSUES",json.dumps({"index":i,"count":len(allissues),"by_enum":dict(sigcounts),
                           "message_classes":dict(cats),"examples_by_enum":list(examples.values())[:8]},ensure_ascii=False)[:14000])
                  except Exception as exc:
                      print("ISSUE_FETCH_FAILED",i,type(exc).__name__,str(exc)[:150])
          except Exception as exc:
              print("BACKUP_FETCH_FAILED",type(exc).__name__,str(exc)[:160])
              sys.exit(2)
