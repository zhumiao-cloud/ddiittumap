name: One-shot cleanup of CloudDrive backup dismissal run records
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-issue-cleanup.yml'
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only this task's finished run and artifact records
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +x
          for run in 38528011793 38528079782 38528247672 38528505551 38528553326; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" --jq .status 2>/dev/null || true)"
            if [ "$state" != completed ]; then
              echo "SKIP_NOT_COMPLETED ${run}"
              continue
            fi
            artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" --jq '.artifacts[].id' 2>/dev/null || true)"
            for artifact in $artifacts; do
              if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}" >/dev/null 2>&1; then
                echo "ARTIFACT_REMOVED"
              else
                echo "ARTIFACT_REMOVE_FAILED"
              fi
            done
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run}" >/dev/null 2>&1; then
              echo "RUN_REMOVED ${run}"
            else
              echo "RUN_REMOVE_FAILED ${run}"
            fi
          done
          echo "CLEANUP_TARGETS_FINISHED"
