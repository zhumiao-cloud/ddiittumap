name: SXY multiome partial status
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-partial-status.yml'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read current ATAC transfer bytes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top "set -u; d=/home/h3039/PROJECTS/zhumiao/multiome_arc_work/P10MK1_1/input/ATAC; date -Is; systemctl --user show sxy-mmul10-multiome-arc-20261010.service -p ActiveState -p SubState -p Result --no-pager; find \"\$d\" -maxdepth 1 -type f -printf '%f|%s\n' 2>/dev/null | sort; printf 'ATAC_TOTAL_BYTES='; find \"\$d\" -maxdepth 1 -type f -printf '%s\n' 2>/dev/null | awk '{s+=\$1} END{printf \"%.0f\\n\",s+0}'; ps -u h3039 -o pid,etime,comm,args | grep '[r]clone copy danxibao3_webdav:P10MK1_1/ATAC' || true"
          unset SSHPASS SXY_PSWD
