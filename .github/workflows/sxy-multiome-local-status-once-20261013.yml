name: SXY local Multiome status audit once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sxy-multiome-local-status-once-20261013.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Audit exact active local-only ARC service and storage without changes
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}" || exit 14
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=25 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          set +x
          echo "CHECK_TIME=$(date -Is)"
          systemctl --user show sxy-mmul10-multiome-local-two-v2-20261013.service -p ActiveState -p SubState -p MainPID -p ExecMainStatus -p Result
          journalctl --user -u sxy-mmul10-multiome-local-two-v2-20261013.service --output=cat --no-pager -n 120 |
            grep -E 'LOCAL_ONLY_START|SAMPLE_BEGIN|STAGE_READ_ONLY|FASTQ_GZIP|ARC_COUNT|PREFLIGHT|LOCAL_ARC_SAMPLE_COMPLETE|CAPACITY_GUARD|ERROR|Error|Fatal|failed|PASS|STOP|NO_WEBDAV|BOTH_REMAINING' | tail -n 16 | cut -c1-200 || true
          W=/home/h3039/PROJECTS/zhumiao/multiome_arc_work
          df -B1 --output=avail "$W" | tail -n 1
          for s in P10MK1_1 P10MK2 P20MK3; do
            p="$W/$s"
            echo "SAMPLE=$s"
            if [ -d "$p" ]; then
              du -sB1 "$p"
              for part in "$p/input" "$p/pipeline/$s/outs"; do
                if [ -d "$part" ]; then du -sB1 "$part"; fi
              done
              if [ -s "$p/.local_arc_verified" ]; then echo "LOCAL_VERIFIED=$s"; fi
              if [ -s "$p/.postarc_rds_validated" ]; then echo "RDS_VERIFIED=$s"; fi
              if [ -s "$p/cellranger_arc_console.log" ]; then tail -n 2 "$p/cellranger_arc_console.log" | cut -c1-140; fi
            else echo LOCAL_STAGE_ABSENT; fi
          done
          ps -u h3039 -o comm= | sort | uniq -c | grep -E 'rclone|gzip|STAR|cellranger|bash|R' || true
          echo AUDIT_LOCAL_ONLY_FINISHED
          REMOTE
          unset SSHPASS SXY_PSWD
