name: SXY multiome ATAC manifest
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-atac-manifest.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Read ATAC manifest metadata only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          export HTTPS_PROXY=http://127.0.0.1:19324 https_proxy=http://127.0.0.1:19324
          src='danxibao3_webdav:P10MK1_1/ATAC'
          echo FILES
          timeout 45 rclone lsf "$src" --files-only | head -n 80
          echo MANIFESTS
          while IFS= read -r f; do
            case "$f" in
              *md5*|*.MD5|*.txt)
                echo "FILE=$f"
                timeout 30 rclone cat "$src/$f" | head -n 80 || true
                ;;
            esac
          done < <(timeout 45 rclone lsf "$src" --files-only)
          REMOTE
          unset SSHPASS SXY_PSWD
