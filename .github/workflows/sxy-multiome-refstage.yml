name: SXY multiome Mmul10 reference stage
on:
  push:
    paths:
      - '.github/workflows/sxy-multiome-refstage.yml'
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SXY_PSWD: ${{ secrets.SXY_PSWD }}
    steps:
      - name: Stage verified Mmul10 Ensembl113 reference and resume ARC service
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          test -n "${SXY_PSWD:-}"
          echo "::add-mask::$SXY_PSWD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass pigz >/dev/null
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -p 20111 sxycloud1.top > "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          export SSHPASS="$SXY_PSWD"

          remote_ref='/home/h3039/reference/Mmul_10_Ensembl113_ARC220/reference.json'
          if sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30 h3039@sxycloud1.top "test -s '$remote_ref'"; then
            echo 'REFERENCE_ALREADY_READY=YES'
            sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes h3039@sxycloud1.top 'bash -s' <<'REMOTE'
          set -euo pipefail
          unit=sxy-mmul10-multiome-arc-20261010
          if [ "$(systemctl --user is-active "$unit" 2>/dev/null || true)" != active ]; then
            systemctl --user reset-failed "$unit" 2>/dev/null || true
            systemctl --user restart "$unit"
            echo SERVICE_ACTION=RESTARTED
          else
            echo SERVICE_ACTION=UNCHANGED_ACTIVE
          fi
          systemctl --user show "$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          REMOTE
            unset SSHPASS SXY_PSWD
            exit 0
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"; unset SSHPASS SXY_PSWD' EXIT
          base='https://ftp.ensembl.org/pub/release-113'
          fa='Macaca_mulatta.Mmul_10.dna.toplevel.fa.gz'
          gt='Macaca_mulatta.Mmul_10.113.gtf.gz'
          curl -fLsS --retry 8 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 4096             -o "$tmp/$fa" "$base/fasta/macaca_mulatta/dna/$fa"
          curl -fLsS --retry 8 --retry-all-errors --connect-timeout 30 --speed-time 120 --speed-limit 4096             -o "$tmp/$gt" "$base/gtf/macaca_mulatta/$gt"
          test "$(stat -c %s "$tmp/$fa")" -gt 500000000
          test "$(stat -c %s "$tmp/$gt")" -gt 10000000
          pigz -t -p 4 "$tmp/$fa"
          pigz -t -p 4 "$tmp/$gt"
          echo "RUNNER_REFERENCE_VERIFIED fa=$(stat -c %s "$tmp/$fa") gtf=$(stat -c %s "$tmp/$gt")"

          remote_stage='/home/h3039/reference/.Mmul_10_Ensembl113_ARC220_build/parallel_stage.new'
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes h3039@sxycloud1.top             "rm -rf '$remote_stage'; mkdir -p '$remote_stage/FA' '$remote_stage/GT'; chmod -R 700 '$remote_stage'"

          send_chunks() {
            src="$1"; label="$2"
            d="$tmp/chunks_$label"; mkdir -p "$d"
            split -b 16M -d -a 4 "$src" "$d/chunk."
            find "$d" -type f -print0 | sort -z | xargs -0 -P 24 -I{} bash -c '
              f="$1"; label="$2"; base=$(basename "$f")
              for n in 1 2 3; do
                if sshpass -e scp -q -P 20111 -o StrictHostKeyChecking=yes -o ConnectTimeout=30                   "$f" "h3039@sxycloud1.top:/home/h3039/reference/.Mmul_10_Ensembl113_ARC220_build/parallel_stage.new/$label/$base"; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
            ' _ {} "$label"
          }
          send_chunks "$tmp/$fa" FA
          send_chunks "$tmp/$gt" GT

          fa_size="$(stat -c %s "$tmp/$fa")"
          gt_size="$(stat -c %s "$tmp/$gt")"
          sshpass -e ssh -p 20111 -o StrictHostKeyChecking=yes h3039@sxycloud1.top 'bash -s' <<REMOTE
          set -euo pipefail
          set +x
          stage='/home/h3039/reference/.Mmul_10_Ensembl113_ARC220_build/parallel_stage.new'
          dest='/home/h3039/reference/.Mmul_10_Ensembl113_ARC220_build/inputs'
          fa='$fa'; gt='$gt'
          mkdir -p "\$dest"
          cat "\$stage"/FA/chunk.* > "\$stage/\$fa"
          cat "\$stage"/GT/chunk.* > "\$stage/\$gt"
          test "\$(stat -c %s "\$stage/\$fa")" = '$fa_size'
          test "\$(stat -c %s "\$stage/\$gt")" = '$gt_size'
          pigz -t -p 8 "\$stage/\$fa"
          pigz -t -p 8 "\$stage/\$gt"
          echo SERVER_REASSEMBLY_VERIFIED

          cp -f "\$stage/\$fa" "\$dest/\$fa.ready"
          cp -f "\$stage/\$gt" "\$dest/\$gt.ready"
          pigz -t -p 8 "\$dest/\$fa.ready"
          pigz -t -p 8 "\$dest/\$gt.ready"
          unit=sxy-mmul10-multiome-arc-20261010
          systemctl --user stop "\$unit" 2>/dev/null || true
          rm -f "\$dest/\$fa.part" "\$dest/\$gt.part"
          mv -f "\$dest/\$fa.ready" "\$dest/\$fa"
          mv -f "\$dest/\$gt.ready" "\$dest/\$gt"
          runner='/home/h3039/PROJECTS/zhumiao/.multiome_arc_runner/sxy_mmul10_arc_build_and_run.sh'
          test -s "\$runner"
          systemctl --user reset-failed "\$unit" 2>/dev/null || true
          systemctl --user restart "\$unit"
          sleep 5
          systemctl --user show "\$unit" -p ActiveState -p SubState -p Result -p ExecMainStatus --no-pager
          journalctl --user -u "\$unit" --no-pager --output=cat -n 40 | tail -n 40
          rm -rf "\$stage"
          REMOTE
          echo REFERENCE_STAGE_COMPLETE
