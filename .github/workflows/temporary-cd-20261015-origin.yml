name: Temporary CloudDrive failed transfer origin matrix
on:
  push:
    paths:
      - '.github/workflows/temporary-cd-20261015-origin.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'zhumiao-cloud/ddiittumap' && github.actor == 'zhumiao-cloud' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Inspect anonymized transfer failure origin to destination matrix
        shell: bash
        env:
          CD_TOKEN: ${{ secrets.CD_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$CD_TOKEN"
          echo "::add-mask::$CD_TOKEN"
          umask 077
          trap 'rm -rf /tmp/cd-origin' EXIT
          mkdir -p /tmp/cd-origin
          curl -fsSL --max-time 35 https://www.clouddrive2.com/api/clouddrive.proto -o /tmp/cd-origin/clouddrive.proto
          python3 -m pip install --disable-pip-version-check -q protobuf grpcio-tools
          python3 -m grpc_tools.protoc -I/tmp/cd-origin --python_out=/tmp/cd-origin /tmp/cd-origin/clouddrive.proto
          cat >/tmp/cd-origin/origin.py <<'PY'
          import os,ssl,http.client,struct,hashlib,re,json,collections,sys
          from google.protobuf import message_factory
          import clouddrive_pb2 as pb
          TOKEN=os.environ["CD_TOKEN"]; S=pb.DESCRIPTOR.services_by_name["CloudDriveFileSrv"]
          def cls(d):return message_factory.GetMessageClass(d)
          def digest(s):return hashlib.sha256(str(s).encode()).hexdigest()[:12]
          def name(m,f):
           d=m.DESCRIPTOR.fields_by_name[f]; v=getattr(m,f)
           return d.enum_type.values_by_number[int(v)].name if d.type==14 else str(v)
          def cat(v):
           s=str(v).lower()
           if re.search(r"sync.owner|sync_owner|other.*instance|another.*instance|another.*sync|another.*backup|different.*instance|另一个.*(实例|同步)|其他.*(实例|同步)|占用|owner marker|ownership|sync.*owner|managed by",s):return "OWNER_CONFLICT"
           if re.search(r"permission|forbidden|denied|认证|权限|401|403",s):return "PERMISSION"
           if re.search(r"timeout|timed out|connection|网络|超时",s):return "NETWORK"
           if re.search(r"not found|no such|不存在|未找到",s):return "NOT_FOUND"
           if re.search(r"conflict|冲突|same file|duplicate",s):return "FILE_CONFLICT"
           if re.search(r"error|failed|失败|错误",s):return "OTHER_FAILURE"
           return "OTHER"
          def rpc(method,req=None):
           d=S.methods_by_name[method]; req=req or cls(d.input_type)(); dat=req.SerializeToString()
           c=http.client.HTTPSConnection("cd.evren.cn",443,timeout=50,context=ssl.create_default_context())
           try:
            c.request("POST","/clouddrive.CloudDriveFileSrv/"+method,b"\0"+struct.pack(">I",len(dat))+dat,{"content-type":"application/grpc-web+proto","accept":"application/grpc-web+proto","x-grpc-web":"1","origin":"https://cd.evren.cn","authorization":"Bearer "+TOKEN})
            r=c.getresponse(); h={k.lower():v for k,v in r.getheaders()}; code=r.status; raw=r.read(9_000_001)
           finally:c.close()
           if len(raw)>9_000_000:raise RuntimeError(method+" oversized")
           pos=0; trailers={};out=[]
           while pos<len(raw):
            if pos+5>len(raw):raise RuntimeError("short frame")
            fl=raw[pos]; length=int.from_bytes(raw[pos+1:pos+5],"big");pos+=5
            if pos+length>len(raw):raise RuntimeError("bad frame")
            chunk=raw[pos:pos+length];pos+=length
            if fl&0x80:
             for line in chunk.decode(errors="replace").splitlines():
              if ":" in line:
               k,v=line.split(":",1);trailers[k.lower().strip()]=v.strip()
            else:
             if fl&1:raise RuntimeError("compressed frame")
             x=cls(d.output_type)();x.ParseFromString(chunk);out.append(x)
           grpc=trailers.get("grpc-status",h.get("grpc-status"))
           print("RPC",method,"http",code,"grpc",grpc or "MISSING","messages",len(out),flush=True)
           if code!=200 or grpc!="0":raise RuntimeError(method+": bad status "+str(code)+"/"+str(grpc))
           return out
          def under(path,root):
           p=path.rstrip("/");r=root.rstrip("/")
           return bool(r and (p==r or p.startswith(r+"/")))
          def related(a,b):return under(a,b) or under(b,a)
          def getfield(obj,key,default=None):return getattr(obj,key,default)
          
          
          import json,re,collections
          apis=[a for ans in rpc("GetAllCloudApis") for a in ans.apis]
          def pclass(a):
           s=(a.name+" "+a.path).lower()
           return "SFTP" if "sftp" in s else "BAIDU" if "baidu" in s or "百度" in s else "123PAN" if "123" in s else "OTHER"
          def pathclass(v):
           if not isinstance(v,str) or not v:return "UNKNOWN"
           hits=[(len(x.path),pclass(x)) for x in apis if x.path and (v==x.path or v.startswith(x.path.rstrip("/")+"/"))]
           return max(hits)[1] if hits else "UNKNOWN"
          rq=cls(S.methods_by_name["GetUploadFileList"].input_type)()
          rq.getAll=False;rq.itemsPerPage=200
          rq.statusFilter=rq.DESCRIPTOR.fields_by_name["statusFilter"].enum_type.values_by_name["FatalError"].number
          matrix=collections.Counter();patterns=collections.Counter()
          sample_total=0;fieldNames=None;firstCodes=collections.Counter()
          for page in (1,2,3,4,5):
           rq.pageNumber=page
           try:
            results=rpc("GetUploadFileList",rq)
           except Exception as e:
            print("FAILED_PAGE",page,type(e).__name__,flush=True)
            continue
           for x in results:
            for f in x.uploadFiles:
             sample_total+=1
             if fieldNames is None:
              fieldNames=[a.name for a in f.DESCRIPTOR.fields]
              print("FATAL_ITEM_FIELDS",fieldNames)
             paths={k:str(getattr(f,k)) for k in fieldNames if ("path" in k.lower() or "source" in k.lower()) and k in f.DESCRIPTOR.fields_by_name and f.DESCRIPTOR.fields_by_name[k].type==9}
             source=next((pathclass(v) for k,v in paths.items() if any(n in k.lower() for n in ("src","source","origin")) and v),"UNKNOWN")
             dest=next((pathclass(v) for k,v in paths.items() if any(n in k.lower() for n in ("dest","target")) and v),"UNKNOWN")
             err=str(getattr(f,"errorMessage","")).lower()
             has_sftp="sftp" in err
             has_download="download" in err
             has_request="request" in err
             has_reset="reset" in err
             patterns[(source,dest,has_sftp,has_download,has_request,has_reset)]+=1
             firstCodes["SFTP_PLUS_DOWNLOAD" if has_sftp and has_download else "SFTP_NO_DOWNLOAD" if has_sftp else "NO_SFTP"]+=1
          print("FAILED_UPLOAD_SOURCE_MATRIX",json.dumps({"n":sample_total,"top":[{"origin":k[0],"destination":k[1],"sftpInError":k[2],"downloadInError":k[3],"requestInError":k[4],"resetInError":k[5],"n":n} for k,n in patterns.most_common(18)],"sftpPresence":dict(firstCodes)}),flush=True)
          
          PY
          PYTHONPATH=/tmp/cd-origin python3 -u /tmp/cd-origin/origin.py
